<script>
// tataBé « Viens avec ton kit » — rafale de cartes façon stop-motion (d'après la référence) : ~20 s, sans voix off.
// Entrée : photo instantanée sous film protecteur qui se décolle, titre tapé lettre à lettre, stickers posés un à un.
// Puis une carte = une idée, posée d'un coup toutes les 0,6-1 s ; pause « objet » ; carte finale tenue.
const W = 1080, H = 1920;
let g = document.getElementById('c').getContext('2d');
const BLEU = '#0648f2', NAVY = '#0b1a4f', VIVID = '#0b46a8', VIVID_R = '#1560d4', TURQ = '#14b3d6', TURQ_R = '#3cc8e6', ORANGE = '#f99d0a', CREAM = '#f7f1e3', WH = '#ffffff', GREY = '#c9ced3', GREY_D = '#a7afb7', LAGON_L = '#1675b8', PINK = '#ff4f8b';
const FPS_ANIM = 12;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, p) => a + (b - a) * p;
function hash(a, b) { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); }
let STEP = 0, BOIL = 1;
const jit = (id, amp = 2) => (hash(STEP, id) - .5) * 2 * amp * BOIL;

// ---------------------------------------------------------------- minutage
// Calé sur « Leo N'Gomma » (Baco), 74 BPM : extrait pris à 2,256 s du fichier source, avec une mesure répétée (+3,24 s, montage musical sur le temps) pour laisser respirer les séquences ; demi-temps hb(n) en temps vidéo.
const hb = n => .077 + n * .4054;
const ENTRY_END = hb(10);                 // entrée tenue un temps de plus
// Récit : accroche → 2e édition → LE PROBLÈME (le jetable finit sur la plage) → objectif zéro déchet → le kit → la plage → la règle → LA RÉCOMPENSE (le lagon) → rendez-vous
const RUN1 = [ // [début, durée, carte]
  [hb(10), 1.22, 'edition'], [hb(13), .81, 'plateau'], [hb(15), 1.62, 'probleme'],
  [hb(19), .81, 'objectif'], [hb(21), .81, 'zero'], [hb(23), .81, 'dechet'], [hb(25), 1.62, 'kit'],
];
// Scène kit : UN seul sac qui se remplit objet par objet, compteur, « TON KIT EST PRÊT ! », puis la caméra plonge dans le sac
const KIT = [hb(29), hb(43)];
const KIT_ITEMS = [ // [apparition, chute, sticker, mot] ; le sac lui-même ouvre la scène
  [hb(29), null, null, 'TON SAC'],
  [hb(31), hb(33.4), 'plateFood', 'ASSIETTE'],
  [hb(34), hb(36.4), 'cutlerySet', 'COUVERTS'],
  [hb(37), hb(39.4), 'cup', 'GOBELET'],
];
const KIT_READY = hb(40), DIVE = [hb(42), hb(43)];
const RUN2 = [[hb(43), .81, 'plage'], [hb(55), 1.62, 'aucun'], [hb(59), 1.62, 'lagon']];
// Scène plage : chaque objet apparaît en grand avec son nom puis tombe dans le même sac (rappel du kit)
const BEACH = [hb(45), hb(55)];
const BEACH_ITEMS = [ // [apparition, chute, sticker, mot, sous-titre]
  [hb(45), hb(47.4), 'towel', 'SERVIETTE', ''],
  [hb(48), hb(50.4), 'sunscreen', 'CRÈME SOLAIRE', 'minérale = lagon protégé'],
  [hb(51), hb(53.4), 'hat', 'CHAPEAU', ''],
];
const FINAL_T = hb(63), DUR = 29.82;   // carte finale (se retourne à la place de la carte lagon), tenue 4,2 s
// Version orange & bleu : le fond change de couleur à chaque chapitre, sur le temps
const CHAP = [[0, 'B'], [hb(10), 'O'], [hb(25), 'B'], [hb(43), 'O'], [hb(55), 'B'], [hb(63), 'O']];
const chapAt = T => { let c = 'B'; for (const [t0, k] of CHAP) if (T >= t0) c = k; return c; };
// entrées variées aux charnières : balayage, zoom à travers (la plage sort du sac)
const ENTER = { edition: 'sweep', kit: 'zoom', plage: 'zoom', probleme: 'sweep', lagon: 'sweep' };
const ROT = [-.07, .05, -.03, .08, -.06, .04, -.08, .06, -.04, .07, -.05, .03];

window.SFX = [
  [0.05, 'slap', { k: .6 }], [.13, 'rustle', { d: .5 }], [1.1, 'tape'],
  ...[0, 1, 2, 3, 4, 5].map(i => [1.1 + i * .083, 'tick']),
  [1.62, 'pop', { pitch: 1.2 }], [1.8, 'tape'], [2.05, 'scribble'], [2.4, 'pop'], [2.6, 'pop', { pitch: 1.1 }], [2.8, 'pop', { pitch: 1.25 }],
  ...RUN1.map(([t], i) => [t, 'slap', { k: .8 + (i % 3) * .1 }]),
  [hb(10) - .05, 'whoosh'], [hb(15) - .05, 'whoosh'], [hb(15) + .6, 'scribble'], [hb(21) + .05, 'impact'], [hb(25) - .05, 'swoosh'], [hb(25) + .17, 'impact'], [DIVE[0], 'riser', { d: .5 }], [hb(43), 'whoosh'], [hb(59) - .05, 'whoosh'], [hb(59) + .3, 'ding'],
  [KIT[0], 'slap'], [KIT[0] + .05, 'impact'], ...KIT_ITEMS.slice(1).flatMap(([a, d], i) => [[a, 'whoosh'], [a + .05, 'pop', { pitch: 1 + i * .15 }], [d + .2, 'drip', { pitch: 1 + i * .15 }]]), [KIT_READY, 'ding'], [KIT_READY + .05, 'impact'],
  [2.95, 'slap', { k: .5 }],
  ...RUN2.map(([t]) => [t, 'slap']), [BEACH[0], 'slap', { k: .6 }], ...BEACH_ITEMS.flatMap(([a, d], i) => [[a, 'whoosh'], [a + .05, 'pop', { pitch: 1 + i * .15 }], [d + .2, 'drip', { pitch: 1 + i * .15 }]]), [hb(54), 'ding'], [hb(56), 'pop', { pitch: 1.1 }], [hb(56) + .05, 'impact'], [hb(57), 'pop', { pitch: 1.3 }],
  [FINAL_T, 'swoosh'], [FINAL_T + .17, 'slap'], [FINAL_T + .55, 'tape'], [FINAL_T + .95, 'jingle'],
];

const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
let FOND, FOND_O, GRAIN, LOGO_N, LOGO_W, PILL, PART, FEMME, PLAGE, PLATEAU;

// ---------------------------------------------------------------- texte
function setFont(f, s) { g.font = `${f === 'Caveat' ? '700 ' : ''}${s}px ${f}`; }
function txt(str, x, y, { f = 'Anton', s = 80, col = WH, a = 1, align = 'center', maxW = 860, stroke = 0, strokeCol = WH } = {}) {
  if (a <= 0 || !str) return;
  g.save(); g.globalAlpha *= a; setFont(f, s);
  const m = g.measureText(str).width; if (m > maxW) { s *= maxW / m; setFont(f, s); }
  g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = stroke; g.strokeStyle = strokeCol; g.strokeText(str, x, y); }
  g.fillStyle = col; g.fillText(str, x, y); g.restore();
}
// Mot géant en relief (extrusion), contour, lettres qui « vivent » à chaque image
function bigWord(str, x, y, s, { col = WH, depthCol = NAVY, outline = NAVY, depth = 16, maxW = 780, id = 0, rot = 0 } = {}) {
  g.save(); g.translate(x, y); g.rotate(rot); setFont('Anton', s);
  let m = g.measureText(str).width; if (m > maxW) { s *= maxW / m; setFont('Anton', s); m = g.measureText(str).width; }
  g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineJoin = 'round';
  let cx = -m / 2;
  [...str].forEach((ch, i) => {
    const w = g.measureText(ch).width, dy = jit(id * 31 + i, s * .025), dr = jit(id * 37 + i, .035);
    g.save(); g.translate(cx + w / 2, dy); g.rotate(dr);
    for (let k = depth; k > 0; k -= 2) { g.fillStyle = depthCol; g.fillText(ch, -w / 2 + k * .7, k); }
    g.lineWidth = s * .07; g.strokeStyle = outline; g.strokeText(ch, -w / 2, 0);
    g.fillStyle = col; g.fillText(ch, -w / 2, 0); g.restore();
    cx += w;
  });
  g.restore();
}

// ---------------------------------------------------------------- papier, traits
function tornPath(w, h, seed) {
  g.beginPath(); const st = 14;
  for (let x = -w / 2; x <= w / 2; x += st) g.lineTo(x, -h / 2 + (hash(seed, x) - .5) * 7);
  for (let y = -h / 2; y <= h / 2; y += st) g.lineTo(w / 2 + (hash(seed + 1, y) - .5) * 14, y);
  for (let x = w / 2; x >= -w / 2; x -= st) g.lineTo(x, h / 2 + (hash(seed + 2, x) - .5) * 7);
  for (let y = h / 2; y >= -h / 2; y -= st) g.lineTo(-w / 2 + (hash(seed + 3, y) - .5) * 14, y);
  g.closePath();
}
function torn(x, y, w, h, { rot = 0, col = WH, seed = 1 } = {}, inner) {
  g.save(); g.translate(x + jit(seed, 2), y + jit(seed + 9, 2)); g.rotate(rot + jit(seed + 5, .006));
  g.save(); g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 10; g.shadowOffsetY = 6; tornPath(w, h, seed); g.fillStyle = col; g.fill(); g.restore();
  g.save(); tornPath(w, h, seed); g.clip(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .45; g.drawImage(GRAIN, -w / 2, -h / 2, Math.max(w, 400), Math.max(h, 400)); g.restore();
  if (inner) inner();
  g.restore();
}
function hand(pts, p, { col = NAVY, w = 9, seed = 1 } = {}) {
  if (p <= 0) return; const n = Math.max(2, Math.floor(pts.length * clamp(p)));
  g.save(); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let i = 0; i < n; i++) g.lineTo(pts[i][0] + (hash(seed, i) - .5) * 3, pts[i][1] + (hash(seed + 1, i) - .5) * 3);
  g.stroke(); g.restore();
}
const ellipsePts = (cx, cy, rx, ry, turns = 1.12, a0 = -2.4) => Array.from({ length: 81 }, (_, i) => { const a = a0 + i / 80 * Math.PI * 2 * turns, k = 1 + .06 * Math.sin(i * .3); return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]; });
const swirlPts = (cx, cy, r) => Array.from({ length: 90 }, (_, i) => { const t = i / 89, a = t * Math.PI * 5; return [cx + Math.cos(a) * r * (1 - t * .6) + t * 40, cy + Math.sin(a) * r * .7 * (1 - t * .6) + t * 160]; });
function sparkle(x, y, r, col = WH, id = 0) {
  const k = .85 + .3 * hash(STEP, id);
  g.save(); g.translate(x, y); g.scale(k, k); g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, rr = i % 2 ? r * .28 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.fill(); g.restore();
}
function rays(col, n = 28) { g.fillStyle = col; for (let i = 0; i < n; i += 2) { const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a0) * 2000, Math.sin(a0) * 2000); g.lineTo(Math.cos(a1) * 2000, Math.sin(a1) * 2000); g.fill(); } }
function grid(w, h) { g.strokeStyle = 'rgba(22,138,207,.25)'; g.lineWidth = 2; for (let x = -w / 2; x < w / 2; x += 44) { g.beginPath(); g.moveTo(x, -h / 2); g.lineTo(x, h / 2); g.stroke(); } for (let y = -h / 2; y < h / 2; y += 44) { g.beginPath(); g.moveTo(-w / 2, y); g.lineTo(w / 2, y); g.stroke(); } }
function dots(w, h, col) { g.fillStyle = col; for (let y = -h / 2; y < h / 2; y += 60) for (let x = -w / 2 + (Math.round(y / 60) % 2 ? 30 : 0); x < w / 2; x += 60) { g.beginPath(); g.arc(x, y, 8, 0, Math.PI * 2); g.fill(); } }

// ---------------------------------------------------------------- pictos / stickers
const P = {
  fork: new Path2D('M5 4v18c0 5 3 8 7 8s7-3 7-8V4M9.6 4v15M14.4 4v15M12 30v48'),
  spoonHead: new Path2D('M12 4c4.2 0 7.5 5 7.5 11s-3.3 11-7.5 11-7.5-5-7.5-11 3.3-11 7.5-11z'),
  spoonHandle: new Path2D('M12 26v52'),
  knife: new Path2D('M10 78V40c-3 0-4-6-4-16S8 4 14 4c2 0 3 2 3 5v31h-7z'),
  knifeHandle: new Path2D('M13 44v34'),
};
// ---------------------------------------------------------------- objets, piste A « découpés dans l'affiche »
// Une seule famille : aplats de la palette de l'affiche, même contour bleu marine (OL), vus de face,
// grain papier, motif de fleurs blanches de la robe (salouva) sur les textiles, liseré blanc découpé aux ciseaux.
const OL = NAVY, LW = 9, SABLE = '#f3dfb4', SABLE_D = '#d9b46a';
function shape(path, fill) { g.fillStyle = fill; g.fill(path); g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = OL; g.lineWidth = LW; g.stroke(path); }
function flower(x, y, r, col = WH, rot = 0) { // fleur d'ylang-ylang (symbole de Mayotte) : 6 pétales longs, étroits, ondulés, rayonnant en étoile
  g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col;
  for (let i = 0; i < 6; i++) {
    g.save(); g.rotate(i / 6 * Math.PI * 2 + (hash(i, 3) - .5) * .35);
    const L = r * (.9 + hash(i, 5) * .2), w = r * .15, wav = r * .07 * (i % 2 ? 1 : -1), N = 16, pts = [];
    for (let k = 0; k <= N; k++) { const t = k / N, half = w * Math.sin(Math.PI * Math.pow(t, .7)) * (1 - .35 * t); pts.push([wav * Math.sin(Math.PI * 2 * t) + half, -L * t]); }
    for (let k = N; k >= 0; k--) { const t = k / N, half = w * Math.sin(Math.PI * Math.pow(t, .7)) * (1 - .35 * t); pts.push([wav * Math.sin(Math.PI * 2 * t) - half, -L * t]); }
    g.beginPath(); pts.forEach(([a, b], k) => k ? g.lineTo(a, b) : g.moveTo(a, b)); g.closePath(); g.fill(); g.restore();
  }
  g.fillStyle = '#c9d64a'; g.beginPath(); g.arc(0, 0, r * .13, 0, Math.PI * 2); g.fill();   // cœur vert-jaune
  g.restore();
}
function flowers(x0, y0, w, h, r, step, seed = 1) { for (let y = y0 + step / 2, k = 0; y < y0 + h; y += step, k++) for (let x = x0 + (k % 2 ? step / 2 : step / 4); x < x0 + w; x += step) flower(x + (hash(seed, x + y) - .5) * 8, y + (hash(seed + 1, x - y) - .5) * 8, r * 1.7, WH, hash(seed + 2, x * y) * 1.2); }
function rr(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; }
function cutlery(kind, h) { // couverts de la maison : blancs, manche bleu robe, contour marine
  const k = h / 430; g.save(); g.scale(k, k);
  if (kind === 'fork') {
    const p = new Path2D('M-46 -200 v95 c0 34 20 56 46 56 s46 -22 46 -56 v-95 M-15 -200 v80 M15 -200 v80');
    g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = OL; g.lineWidth = 34; g.stroke(p); g.strokeStyle = WH; g.lineWidth = 18; g.stroke(p);
    shape(rr(-22, -50, 44, 250, 22), BLEU);
  }
  if (kind === 'spoon') { const hd = new Path2D(); hd.ellipse(0, -140, 58, 82, 0, 0, Math.PI * 2); shape(hd, WH); g.fillStyle = '#dfe8ff'; g.beginPath(); g.ellipse(-14, -158, 16, 34, -.2, 0, Math.PI * 2); g.fill(); shape(rr(-22, -55, 44, 255, 22), BLEU); }
  if (kind === 'knife') { shape(new Path2D('M-10 -60 L-10 -210 C30 -200 44 -150 40 -60 Z'), WH); shape(rr(-24, -66, 48, 266, 24), BLEU); }
  g.restore();
}
function plate(r, food = false) { // assiette vue légèrement de face (ellipse), bord bleu robe
  const ry = r * .62; const out = new Path2D(); out.ellipse(0, 0, r, ry, 0, 0, Math.PI * 2); shape(out, WH);
  g.strokeStyle = BLEU; g.lineWidth = r * .07; g.beginPath(); g.ellipse(0, 0, r * .86, ry * .86, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#eef3ff'; g.beginPath(); g.ellipse(0, ry * .04, r * .62, ry * .58, 0, 0, Math.PI * 2); g.fill();
  if (food) [[-.12, -28], [-.12, 26]].forEach(([a, dy]) => skewer(a, dy, r));
}
function skewer(a, dy, r = 180) { // brochette simplifiée, même contour
  g.save(); g.translate(0, dy); g.rotate(a); g.strokeStyle = OL; g.lineWidth = 12; g.lineCap = 'round'; g.beginPath(); g.moveTo(-r * .8, 0); g.lineTo(r * .8, 0); g.stroke(); g.strokeStyle = SABLE; g.lineWidth = 5; g.stroke();
  [-.42, -.14, .14, .42].forEach((x, i) => { shape(rr(x * r - 24, -24, 48, 48, 14), i % 2 ? '#c4642c' : '#a24d1f'); g.strokeStyle = 'rgba(11,26,79,.55)'; g.lineWidth = 5; g.beginPath(); g.moveTo(x * r - 10, -12); g.lineTo(x * r + 8, 12); g.stroke(); });
  g.restore();
}
function cup(h) { // gobelet réutilisable : blanc, bande bleu robe à fleurs, anse
  const tw = h * .34, bw = h * .27, top = -h / 2, bot = h / 2;
  const handle = new Path2D(); handle.ellipse(tw * .95, -h * .02, h * .15, h * .2, 0, -Math.PI / 2, Math.PI / 2);
  g.strokeStyle = OL; g.lineWidth = h * .08; g.stroke(handle); g.strokeStyle = WH; g.lineWidth = h * .045; g.stroke(handle);
  const body = new Path2D(); body.moveTo(-tw, top); body.lineTo(tw, top); body.lineTo(bw, bot); body.quadraticCurveTo(0, bot + h * .03, -bw, bot); body.closePath();
  shape(body, WH);
  g.save(); g.clip(body); g.fillStyle = BLEU; g.fillRect(-tw, -h * .14, tw * 2, h * .3); flowers(-tw, -h * .14, tw * 2, h * .3, h * .045, h * .14, 7); g.restore();
  g.strokeStyle = OL; g.lineWidth = LW; g.stroke(body);
}
function tote(w, part = 'all', handle = ORANGE) { // sac : bleu robe à fleurs blanches, anses orange
  const h = w * .9, top = -h / 2 + 60;
  if (part !== 'front') {
    const hp = new Path2D(); hp.moveTo(-w * .22, top + 6); hp.bezierCurveTo(-w * .22, top - w * .42, w * .22, top - w * .42, w * .22, top + 6);
    g.save(); g.lineCap = 'round'; g.strokeStyle = WH; g.lineWidth = w * .075 + 26; g.stroke(hp); g.strokeStyle = OL; g.lineWidth = w * .075; g.stroke(hp); g.strokeStyle = handle === NAVY ? ORANGE : handle; g.lineWidth = w * .045; g.stroke(hp);
    g.fillStyle = '#0a2f9c'; g.beginPath(); g.ellipse(0, top + 4, w * .47, w * .045, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  if (part === 'back') return;
  const body = new Path2D(); body.moveTo(-w * .47, top); body.lineTo(w * .47, top); body.lineTo(w / 2, top + h); body.lineTo(-w / 2, top + h); body.closePath();
  g.save(); g.strokeStyle = WH; g.lineWidth = LW + 26; g.lineJoin = 'round'; g.stroke(body); g.restore();   // liseré sticker quand le sac est dessiné en direct
  shape(body, BLEU); g.save(); g.clip(body); flowers(-w / 2, top + 20, w, h - 20, w * .05, w * .24, 3);
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = .35; g.drawImage(GRAIN, -w / 2, top, w, h); g.restore();
  g.strokeStyle = OL; g.lineWidth = LW; g.stroke(body);
}
function towel(w) { // serviette pliée : orange, bande bleue à fleurs, franges
  const h = w * .6, x0 = -w / 2, y0 = -h / 2;
  const body = rr(x0, y0, w, h, 18); shape(body, ORANGE);
  g.save(); g.clip(body); g.fillStyle = BLEU; g.fillRect(x0, y0 + h * .34, w, h * .32); flowers(x0, y0 + h * .34, w, h * .32, w * .04, w * .13, 5);
  g.fillStyle = TURQ; g.fillRect(x0, y0 + h * .12, w, h * .07); g.fillRect(x0, y0 + h * .81, w, h * .07); g.restore();
  g.strokeStyle = OL; g.lineWidth = LW; g.stroke(body);
  g.strokeStyle = OL; g.lineWidth = 5; for (let x = x0 + 20; x < -x0 - 10; x += 22) { g.beginPath(); g.moveTo(x, y0 + h); g.lineTo(x, y0 + h + 22); g.stroke(); }
}
function sunscreen(h) { // tube : blanc, bouchon orange, soleil orange
  const w = h * .44;
  shape(rr(-w * .3, -h / 2, w * .6, h * .14, 10), ORANGE);
  const body = new Path2D(); body.moveTo(-w / 2, -h / 2 + h * .14); body.lineTo(w / 2, -h / 2 + h * .14); body.lineTo(w / 2 - 14, h / 2); body.lineTo(-w / 2 + 14, h / 2); body.closePath();
  shape(body, WH);
  g.save(); g.clip(body); g.fillStyle = BLEU; g.fillRect(-w / 2, h * .26, w, h * .3); flowers(-w / 2, h * .26, w, h * .3, w * .06, w * .26, 9); g.restore();

  const done = KIT_ITEMS.filter(([a, d]) => d === null ? T >= a + .25 : T >= d + .22).length;
  g.save(); g.translate(bx + jit(81, 2), byy + jit(82, 2)); g.rotate(-.04); tote(bw, 'back', NAVY); g.restore();
  // objets déjà rangés qui dépassent du sac
  if (T >= hb(33.4) + .22) sticker('plate', bx - 30, byy - 175, { rot: -.12, sc: .42, id: 71 });
  if (T >= hb(36.4) + .22) sticker('fork', bx - 110, byy - 185, { rot: -.25, sc: .5, id: 72 });
  if (T >= hb(39.4) + .22) sticker('cup', bx + 115, byy - 170, { rot: .2, sc: .42, id: 73 });
  KIT_ITEMS.forEach(([a, d, key], i) => {
    if (!key || T < a) return;
    const q = lin(T, d, d + .22); if (q >= 1) return;
    const pin = T < a + 1 / FPS_ANIM + 1e-6 ? 1.12 : 1, base = { plateFood: 1.25, cutlerySet: .95, cup: .85 }[key];
    sticker(key, mix(bx, bx + (i - 2) * 60, q), mix(720, byy + 140, q * q), { rot: mix(i % 2 ? .08 : -.08, i % 2 ? .7 : -.7, q), sc: mix(base, .4, q) * pin, id: 75 + i });
  });
  g.save(); g.translate(bx + jit(81, 2), byy + jit(82, 2)); g.rotate(-.04); tote(bw, 'front'); g.restore();
  if (T < KIT_READY) bigWord(KIT_ITEMS[cur][3], CX, 345, 170, { col: WH, depthCol: NAVY, outline: NAVY, depth: 14, id: 60 + cur, maxW: 900 });
  else { bigWord('TON KIT', CX, 330, 170, { col: WH, depthCol: NAVY, outline: NAVY, depth: 14, id: 66 }); bigWord('EST PRÊT !', CX, 500, 150, { col: ORANGE, depthCol: NAVY, outline: WH, depth: 14, id: 67 }); }
  if (T < KIT_READY) dots4(done, 4, 480);
  if (T >= KIT_READY) { g.save(); g.translate(bx + 210, byy - 120); const k = T < KIT_READY + .09 ? 1.25 : 1; g.scale(k, k); g.fillStyle = ORANGE; g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.fill(); g.strokeStyle = WH; g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-30, 2); g.lineTo(-9, 26); g.lineTo(32, -24); g.stroke(); g.restore(); }
}
function beachBag(T) {
  const bx = CX, by = 1130, bw = 560;
  // le sac du kit, déjà rempli : fourchette et gobelet dépassent
  g.save(); g.translate(bx + jit(81, 2), by + jit(82, 2)); g.rotate(-.04); tote(bw, 'back', NAVY); g.restore();
  sticker('plate', bx - 30, by - 175, { rot: -.12, sc: .42, id: 71 }); sticker('fork', bx - 110, by - 185, { rot: -.25, sc: .5, id: 72 }); sticker('cup', bx + 115, by - 170, { rot: .2, sc: .42, id: 73 });
  let cur = -1; BEACH_ITEMS.forEach(([a], i) => { if (T >= a) cur = i; });
  BEACH_ITEMS.forEach(([a, d, key, word, sub], i) => {
    if (T < a) return;
    const q = lin(T, d, d + .22);                     // chute dans le sac
    if (q >= 1) return;
    const pin = T < a + 1 / FPS_ANIM + 1e-6 ? 1.12 : 1;
    const x = mix(bx, bx + (i - 1) * 60, q), y = mix(730, by + 140, q * q), sc = mix([1, .8, 1][i], .4, q) * pin;
    sticker(key, x, y, { rot: mix(i % 2 ? .08 : -.08, i % 2 ? .7 : -.7, q), sc, id: 85 + i });
  });
  g.save(); g.translate(bx + jit(81, 2), by + jit(82, 2)); g.rotate(-.04); tote(bw, 'front'); g.restore();
  // le mot de l'objet en cours, en haut (zone sûre)
  if (cur >= 0) {
    const [a, , , word, sub] = BEACH_ITEMS[cur];
    bigWord(word, CX, 345, 170, { col: WH, depthCol: NAVY, outline: NAVY, depth: 14, id: 90 + cur, maxW: 900 });
    if (sub) torn(CX, 462, 620, 92, { rot: -.03, col: WH, seed: 92 }, () => txt(sub, 0, 2, { f: 'Caveat', s: 62, col: NAVY, maxW: 580 }));
  }
  if (T >= hb(54)) { g.save(); g.translate(bx + 210, by - 120); const k = T < hb(54) + .09 ? 1.2 : 1; g.scale(k, k); g.fillStyle = BLEU; g.beginPath(); g.arc(0, 0, 66, 0, Math.PI * 2); g.fill(); g.strokeStyle = WH; g.lineWidth = 15; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-28, 2); g.lineTo(-8, 24); g.lineTo(30, -22); g.stroke(); g.restore(); }
}
function objectBeat(T) {   // (non utilisé depuis la scène kit à sac unique)
  const u = T - KIT[0];
  txt('&', 170, 360, { f: 'Anton', s: 220, col: ORANGE });
  txt('voilà', 280, 310, { f: 'Caveat', s: 100, col: WH, align: 'left' });
  txt('ton kit !', 340, 410, { f: 'Caveat', s: 100, col: WH, align: 'left' });
  const bx = CX, by = 960, bw = 620;
  g.save(); g.translate(bx + jit(91, 2), by + jit(92, 2)); g.rotate(-.04); tote(bw, 'back', ORANGE); g.restore();
  [['plate', .25, -60], ['fork', .5, 40], ['spoon', .75, -20], ['cup', 1.0, 70]].forEach(([k, t0, dx], i) => {
    const q = lin(u, t0 - .25, t0); if (q <= 0 || q >= 1) return;
    sticker(k, bx + dx * q + mix(320 * (i % 2 ? 1 : -1), 0, q), mix(380, by + 120, q * q), { rot: (1 - q) * (i % 2 ? .6 : -.6), sc: .85, id: 93 + i });
  });
  g.save(); g.translate(bx + jit(91, 2), by + jit(92, 2)); g.rotate(-.04); tote(bw, 'front'); g.restore();
  // traits de mouvement autour du sac
  if (u > .2 && u < 1.2) { g.save(); g.strokeStyle = WH; g.lineWidth = 7; g.lineCap = 'round'; [[-1, -1], [1, -1], [-1, .3], [1, .3]].forEach(([sx, sy], i) => { const r0 = 330 + (STEP % 2) * 12; g.beginPath(); g.moveTo(bx + sx * r0, by + sy * 220); g.lineTo(bx + sx * (r0 + 60), by + sy * 250); g.stroke(); }); g.restore(); }
  if (u >= 1.25) { g.save(); g.translate(bx + 220, by - 140); const k = u < 1.34 ? 1.2 : 1; g.scale(k, k); g.fillStyle = ORANGE; g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.fill(); g.strokeStyle = WH; g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-30, 2); g.lineTo(-9, 26); g.lineTo(32, -24); g.stroke(); g.restore(); }
  const words = [['tout', 1.3], ['dans', 1.45], ['ton sac !', 1.6]];
  let x = 230; words.forEach(([w, t0]) => { if (u >= t0) txt(w, x, 1400, { f: 'Caveat', s: 100, col: WH, align: 'left' }); g.save(); setFont('Caveat', 100); x += g.measureText(w + ' ').width; g.restore(); });
}

// ---------------------------------------------------------------- carte finale (tenue, lisible)
function finalCard(T) {
  // carte compacte, remontée : tout (partenaires compris) entre 350 et 1 340 px ; le bas reste libre pour la légende du Reel
  const u = T - FINAL_T, w = 920, h = 1160;
  if (u < .17) return;
  // vague blanche décorative en bas (comme l'affiche) : peut être recouverte par l'interface sans rien perdre
  g.save(); g.fillStyle = '#fbf6ec'; g.beginPath(); g.moveTo(0, H); g.lineTo(0, 1650);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, 1650 + 26 * Math.sin(x / W * Math.PI * 2.2 + .6) + 10 * Math.sin(x / W * Math.PI * 7));
  g.lineTo(W, H); g.closePath(); g.fill(); g.restore();
  const fx = eOut(clamp((u - .17) / .2));   // retournement : la carte s'ouvre sur la tranche
  g.save(); g.translate(CX, 840); g.rotate(-.02); g.scale(.85 * Math.max(.02, fx), .85);
  cardFrame(w, h, WH);
  const lw = 800, lh = LOGO_N.height * lw / LOGO_N.width; g.drawImage(LOGO_N, -lw / 2, -540, lw, lh);
  if (u >= .25) { const pw2 = 450, ph2 = PILL.height * pw2 / PILL.width; g.drawImage(PILL, 200 - pw2 / 2, -255 - ph2 / 2, pw2, ph2); }
  if (u >= .35) txt('17 OCTOBRE · 10H À 18H', 0, -110, { s: 96, col: NAVY, maxW: 820 });
  if (u >= .45) txt('MTSANGAMOUJI', 0, 10, { s: 126, col: NAVY, maxW: 820 });
  if (u >= .55) torn(0, 175, 1000, 160, { rot: -.035, col: BLEU, seed: 71 }, () => txt('VIENS AVEC TON KIT !', 0, 4, { s: 108, col: WH, maxW: 920 }));
  if (u >= .75) { const bw = 900, bh = PART.height * bw / PART.width; g.drawImage(PART, -bw / 2, h / 2 - bh - 8, bw, bh); }
  g.restore();
}

// ================================================================ montage
function render(t) {
  const T = Math.floor(t * FPS_ANIM + 1e-6) / FPS_ANIM; STEP = Math.floor(t * FPS_ANIM + 1e-6);
  BOIL = T >= FINAL_T + 1.0 ? 0 : 1;
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(chapAt(T) === 'O' ? FOND_O : FOND, 0, 0, W, H);
  if (T < ENTRY_END) entry(T);
  else if (T < KIT[0]) runStack(RUN1, T, 0);
  else if (T < KIT[1]) {
    const d = lin(T, DIVE[0], DIVE[1]);   // la caméra plonge dans l'ouverture du sac
    if (d > 0) { const z = 1 + eIn(d) * 7; g.save(); g.translate(CX, 940); g.scale(z, z); g.translate(-CX, -940); kitBag(T); g.restore(); g.fillStyle = `rgba(10,47,156,${eIn(d)})`; g.fillRect(0, 0, W, H); }
    else kitBag(T);
  }
  else if (T >= BEACH[0] && T < BEACH[1]) beachBag(T);
  else if (T < FINAL_T) runStack(RUN2, T, 20);
  else { const f = clamp((T - FINAL_T) / .17); if (f < 1) { g.save(); g.translate(CX, 0); g.scale(Math.max(.02, 1 - f * f), 1); g.translate(-CX, 0); runStack(RUN2, FINAL_T - .01, 20); g.restore(); } finalCard(T); }   // la carte lagon se retourne et devient la carte finale   // la pile tombe, la carte finale claque
}

  makeSticker('cupDispo', 460, () => { const h = 380, tw = h * .34, bw = h * .25; const b = new Path2D(); b.moveTo(-tw, -h / 2); b.lineTo(tw, -h / 2); b.lineTo(bw, h / 2); b.lineTo(-bw, h / 2); b.closePath(); shape(b, '#e3e7ea'); g.strokeStyle = '#a9b0b8'; g.lineWidth = 6; for (let k = 1; k < 6; k++) { const y = -h / 2 + k * h / 6, w = mix(tw, bw, k / 6) * .9; g.beginPath(); g.moveTo(-w, y); g.lineTo(w, y); g.stroke(); } });
  makeSticker('bagDispo', 460, () => { g.save(); g.scale(1.2, 1.2); plasticBag(300); g.restore(); });
  makeSticker('cutlerySet', 560, () => { g.save(); g.translate(-130, 10); g.rotate(-.18); cutlery('fork', 380); g.restore(); g.save(); g.translate(0, -10); cutlery('spoon', 380); g.restore(); g.save(); g.translate(130, 10); g.rotate(.18); cutlery('knife', 380); g.restore(); });
  render(0); window.ready = true;
});
