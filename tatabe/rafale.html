<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// tataBé « Viens avec ton kit » — rafale de cartes façon stop-motion (d'après la référence) : ~20 s, sans voix off.
// Entrée : photo instantanée sous film protecteur qui se décolle, titre tapé lettre à lettre, stickers posés un à un.
// Puis une carte = une idée, posée d'un coup toutes les 0,6-1 s ; pause « objet » ; carte finale tenue.
const W = 1080, H = 1920;
let g = document.getElementById('c').getContext('2d');
const BLEU = '#0648f2', NAVY = '#0b1a4f', VIVID = '#0b46a8', VIVID_R = '#1560d4', TURQ = '#14b3d6', TURQ_R = '#3cc8e6', ORANGE = '#f99d0a', CREAM = '#f7f1e3', WH = '#ffffff', GREY = '#c9ced3', GREY_D = '#a7afb7', LAGON_L = '#1675b8', PINK = '#ff4f8b';
const FPS_ANIM = 12;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, p) => a + (b - a) * p;
function hash(a, b) { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); }
let STEP = 0, BOIL = 1;
const jit = (id, amp = 2) => (hash(STEP, id) - .5) * 2 * amp * BOIL;

// ---------------------------------------------------------------- minutage
// Calé sur « Leo N'Gomma » (Baco), 74 BPM : extrait pris à 2,256 s du fichier source (8 demi-temps avant 5,5 s), demi-temps hb(n) en temps vidéo.
const hb = n => .077 + n * .4054;
const ENTRY_END = hb(10);                 // entrée tenue un temps de plus
const RUN1 = [ // [début, durée, carte] : 2 demi-temps par carte, 3 pour le kit
  [hb(10), .81, 'edition'], [hb(12), .81, 'plateau'],
  [hb(14), .81, 'objectif'], [hb(16), .81, 'zero'], [hb(18), .81, 'dechet'], [hb(20), 1.22, 'kit'],
  [hb(23), .81, 'assiette'], [hb(25), .81, 'couverts'], [hb(27), .81, 'gobelet'], [hb(29), .81, 'sac'],
];
const OBJ = [hb(31), hb(35)];           // pause objet : tout dans le sac (raccourcie)
const RUN2 = [[hb(35), .81, 'plage'], [hb(37), .81, 'serviette'], [hb(39), .81, 'creme'], [hb(41), .81, 'chapeau'], [hb(43), 1.62, 'aucun']];   // « aucun jetable sur place » regroupé sur une carte
const FINAL_T = hb(47), DUR = 23.74, PART_T = DUR - 1.05;   // fin allégée, puis carte partenaires
const ROT = [-.07, .05, -.03, .08, -.06, .04, -.08, .06, -.04, .07, -.05, .03];

window.SFX = [
  [0.05, 'slap', { k: .6 }], [hb(1), 'rustle', { d: .5 }], [1.1, 'tape'],
  ...[0, 1, 2, 3, 4, 5].map(i => [1.1 + i * .083, 'tick']),
  [1.62, 'pop', { pitch: 1.2 }], [1.8, 'tape'], [2.05, 'scribble'], [2.4, 'pop'], [2.6, 'pop', { pitch: 1.1 }], [2.8, 'pop', { pitch: 1.25 }],
  ...RUN1.map(([t], i) => [t, 'slap', { k: .8 + (i % 3) * .1 }]),
  [hb(10) + .05, 'impact'], [hb(16) + .05, 'impact'], [hb(20) + .05, 'swoosh'],
  [OBJ[0], 'slap', { k: .6 }], [OBJ[0] + .2, 'drip'], [OBJ[0] + .38, 'drip', { pitch: 1.15 }], [OBJ[0] + .56, 'drip', { pitch: 1.3 }], [OBJ[0] + .74, 'drip', { pitch: 1.45 }], [OBJ[0] + .95, 'ding'], [OBJ[0] + .9, 'scribble'],
  ...RUN2.map(([t]) => [t, 'slap']), [hb(44), 'pop', { pitch: 1.1 }], [hb(44) + .05, 'impact'], [hb(45), 'pop', { pitch: 1.3 }],
  [FINAL_T, 'impact'], [FINAL_T + .02, 'slap'], [FINAL_T + .25, 'slap', { k: .6 }], ...Array.from({ length: 12 }, (_, i) => [FINAL_T + .45 + i * .034, 'tick']), [FINAL_T + .95, 'tape'], [FINAL_T + 1.3, 'jingle'], [PART_T, 'slap'],
];

const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
let FOND, GRAIN, LOGO_N, LOGO_W, PILL, PART, FEMME, PLAGE, PLATEAU;

// ---------------------------------------------------------------- texte
function setFont(f, s) { g.font = `${f === 'Caveat' ? '700 ' : ''}${s}px ${f}`; }
function txt(str, x, y, { f = 'Anton', s = 80, col = WH, a = 1, align = 'center', maxW = 860, stroke = 0, strokeCol = WH } = {}) {
  if (a <= 0 || !str) return;
  g.save(); g.globalAlpha *= a; setFont(f, s);
  const m = g.measureText(str).width; if (m > maxW) { s *= maxW / m; setFont(f, s); }
  g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = stroke; g.strokeStyle = strokeCol; g.strokeText(str, x, y); }
  g.fillStyle = col; g.fillText(str, x, y); g.restore();
}
// Mot géant en relief (extrusion), contour, lettres qui « vivent » à chaque image
function bigWord(str, x, y, s, { col = WH, depthCol = NAVY, outline = NAVY, depth = 16, maxW = 780, id = 0, rot = 0 } = {}) {
  g.save(); g.translate(x, y); g.rotate(rot); setFont('Anton', s);
  let m = g.measureText(str).width; if (m > maxW) { s *= maxW / m; setFont('Anton', s); m = g.measureText(str).width; }
  g.textBaseline = 'middle'; g.textAlign = 'left'; g.lineJoin = 'round';
  let cx = -m / 2;
  [...str].forEach((ch, i) => {
    const w = g.measureText(ch).width, dy = jit(id * 31 + i, s * .025), dr = jit(id * 37 + i, .035);
    g.save(); g.translate(cx + w / 2, dy); g.rotate(dr);
    for (let k = depth; k > 0; k -= 2) { g.fillStyle = depthCol; g.fillText(ch, -w / 2 + k * .7, k); }
    g.lineWidth = s * .07; g.strokeStyle = outline; g.strokeText(ch, -w / 2, 0);
    g.fillStyle = col; g.fillText(ch, -w / 2, 0); g.restore();
    cx += w;
  });
  g.restore();
}

// ---------------------------------------------------------------- papier, traits
function tornPath(w, h, seed) {
  g.beginPath(); const st = 14;
  for (let x = -w / 2; x <= w / 2; x += st) g.lineTo(x, -h / 2 + (hash(seed, x) - .5) * 7);
  for (let y = -h / 2; y <= h / 2; y += st) g.lineTo(w / 2 + (hash(seed + 1, y) - .5) * 14, y);
  for (let x = w / 2; x >= -w / 2; x -= st) g.lineTo(x, h / 2 + (hash(seed + 2, x) - .5) * 7);
  for (let y = h / 2; y >= -h / 2; y -= st) g.lineTo(-w / 2 + (hash(seed + 3, y) - .5) * 14, y);
  g.closePath();
}
function torn(x, y, w, h, { rot = 0, col = WH, seed = 1 } = {}, inner) {
  g.save(); g.translate(x + jit(seed, 2), y + jit(seed + 9, 2)); g.rotate(rot + jit(seed + 5, .006));
  g.save(); g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 10; g.shadowOffsetY = 6; tornPath(w, h, seed); g.fillStyle = col; g.fill(); g.restore();
  g.save(); tornPath(w, h, seed); g.clip(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .45; g.drawImage(GRAIN, -w / 2, -h / 2, Math.max(w, 400), Math.max(h, 400)); g.restore();
  if (inner) inner();
  g.restore();
}
function hand(pts, p, { col = NAVY, w = 9, seed = 1 } = {}) {
  if (p <= 0) return; const n = Math.max(2, Math.floor(pts.length * clamp(p)));
  g.save(); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  for (let i = 0; i < n; i++) g.lineTo(pts[i][0] + (hash(seed, i) - .5) * 3, pts[i][1] + (hash(seed + 1, i) - .5) * 3);
  g.stroke(); g.restore();
}
const ellipsePts = (cx, cy, rx, ry, turns = 1.12, a0 = -2.4) => Array.from({ length: 81 }, (_, i) => { const a = a0 + i / 80 * Math.PI * 2 * turns, k = 1 + .06 * Math.sin(i * .3); return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]; });
const swirlPts = (cx, cy, r) => Array.from({ length: 90 }, (_, i) => { const t = i / 89, a = t * Math.PI * 5; return [cx + Math.cos(a) * r * (1 - t * .6) + t * 40, cy + Math.sin(a) * r * .7 * (1 - t * .6) + t * 160]; });
function sparkle(x, y, r, col = WH, id = 0) {
  const k = .85 + .3 * hash(STEP, id);
  g.save(); g.translate(x, y); g.scale(k, k); g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, rr = i % 2 ? r * .28 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.fill(); g.restore();
}
function rays(col, n = 28) { g.fillStyle = col; for (let i = 0; i < n; i += 2) { const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a0) * 2000, Math.sin(a0) * 2000); g.lineTo(Math.cos(a1) * 2000, Math.sin(a1) * 2000); g.fill(); } }
function grid(w, h) { g.strokeStyle = 'rgba(22,138,207,.25)'; g.lineWidth = 2; for (let x = -w / 2; x < w / 2; x += 44) { g.beginPath(); g.moveTo(x, -h / 2); g.lineTo(x, h / 2); g.stroke(); } for (let y = -h / 2; y < h / 2; y += 44) { g.beginPath(); g.moveTo(-w / 2, y); g.lineTo(w / 2, y); g.stroke(); } }
function dots(w, h, col) { g.fillStyle = col; for (let y = -h / 2; y < h / 2; y += 60) for (let x = -w / 2 + (Math.round(y / 60) % 2 ? 30 : 0); x < w / 2; x += 60) { g.beginPath(); g.arc(x, y, 8, 0, Math.PI * 2); g.fill(); } }

// ---------------------------------------------------------------- pictos / stickers
const P = {
  fork: new Path2D('M5 4v18c0 5 3 8 7 8s7-3 7-8V4M9.6 4v15M14.4 4v15M12 30v48'),
  spoonHead: new Path2D('M12 4c4.2 0 7.5 5 7.5 11s-3.3 11-7.5 11-7.5-5-7.5-11 3.3-11 7.5-11z'),
  spoonHandle: new Path2D('M12 26v52'),
  knife: new Path2D('M10 78V40c-3 0-4-6-4-16S8 4 14 4c2 0 3 2 3 5v31h-7z'),
  knifeHandle: new Path2D('M13 44v34'),
};
function cutlery(kind, h) {
  const k = h / 84; g.save(); g.scale(k, k); g.translate(-12, -42); g.lineCap = 'round'; g.lineJoin = 'round';
  const two = (p, a, b) => { g.strokeStyle = LAGON_L; g.lineWidth = a; g.stroke(p); g.strokeStyle = '#f2f6fa'; g.lineWidth = b; g.stroke(p); };
  const filled = p => { g.lineWidth = 2.4; g.strokeStyle = LAGON_L; g.fillStyle = '#f2f6fa'; g.fill(p); g.stroke(p); };
  if (kind === 'fork') two(P.fork, 5.4, 2.8);
  if (kind === 'spoon') { two(P.spoonHandle, 6.2, 3.6); filled(P.spoonHead); }
  if (kind === 'knife') { two(P.knifeHandle, 7.4, 4.8); filled(P.knife); }
  g.restore();
}
function plate(r) { g.fillStyle = WH; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill(); g.strokeStyle = LAGON_L; g.lineWidth = r * .085; g.beginPath(); g.arc(0, 0, r * .955, 0, Math.PI * 2); g.stroke(); g.strokeStyle = '#d6e6f2'; g.lineWidth = r * .03; g.beginPath(); g.arc(0, 0, r * .66, 0, Math.PI * 2); g.stroke(); }
function cup(h) {
  const tw = h * .36, bw = h * .27, top = -h / 2, bot = h / 2;
  const body = () => { g.beginPath(); g.moveTo(-tw, top); g.lineTo(tw, top); g.lineTo(bw, bot); g.quadraticCurveTo(0, bot + h * .03, -bw, bot); g.closePath(); };
  g.strokeStyle = LAGON_L; g.lineWidth = h * .06; g.beginPath(); g.ellipse(tw * .98, 0, h * .14, h * .2, 0, -Math.PI / 2, Math.PI / 2); g.stroke();
  body(); g.fillStyle = '#f2f6fa'; g.fill(); g.lineWidth = h * .025; g.stroke();
  g.save(); body(); g.clip(); g.fillStyle = LAGON_L; g.fillRect(-tw, -h * .08, tw * 2, h * .16); g.restore();
  g.lineWidth = h * .035; g.beginPath(); g.moveTo(-tw, top); g.lineTo(tw, top); g.stroke();
}
function tote(w, part = 'all', handle = NAVY) {
  const h = w * .9, top = -h / 2 + 60;
  if (part !== 'front') { g.save(); g.lineCap = 'round'; g.strokeStyle = handle; g.lineWidth = w * .06; g.beginPath(); g.moveTo(-w * .22, top + 6); g.bezierCurveTo(-w * .22, top - w * .42, w * .22, top - w * .42, w * .22, top + 6); g.stroke(); g.fillStyle = '#d9cdb0'; g.beginPath(); g.ellipse(0, top + 4, w * .47, w * .04, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
  if (part === 'back') return;
  g.fillStyle = CREAM; g.beginPath(); g.moveTo(-w * .47, top); g.lineTo(w * .47, top); g.lineTo(w / 2, top + h); g.lineTo(-w / 2, top + h); g.closePath(); g.fill();
  g.strokeStyle = NAVY; g.lineWidth = w * .035; g.lineCap = 'round'; g.beginPath();
  for (let i = 0; i <= 40; i++) g.lineTo(-w * .28 + i / 40 * w * .56, h * .22 + w * .03 * Math.sin(i / 40 * Math.PI * 4)); g.stroke();
}
function towel(w) { // serviette roulée à rayures
  const h = w * .62; g.save(); g.rotate(-.05);
  g.fillStyle = WH; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 26); g.fill();
  g.save(); g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 26); g.clip();
  [[ORANGE, -.3], [BLEU, -.1], [ORANGE, .1], [TURQ, .3]].forEach(([c, y]) => { g.fillStyle = c; g.fillRect(-w / 2, y * h - h * .06, w, h * .12); }); g.restore();
  g.fillStyle = '#f2f2f2'; g.beginPath(); g.ellipse(w / 2 - 10, 0, 60, h / 2, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#d8d8d8'; g.lineWidth = 6; for (let r = 46; r > 6; r -= 14) { g.beginPath(); g.ellipse(w / 2 - 10, 0, r * .9, r * h / 120, 0, 0, Math.PI * 2); g.stroke(); }
  g.fillStyle = WH; for (let x = -w / 2 + 18; x < w / 2 - 70; x += 26) { g.beginPath(); g.arc(x, h / 2, 7, 0, Math.PI); g.fill(); }
  g.restore();
}
function sunscreen(h) { // tube de crème solaire
  const w = h * .42; g.save();
  g.fillStyle = WH; g.beginPath(); g.moveTo(-w / 2, -h / 2 + 40); g.lineTo(w / 2, -h / 2 + 40); g.lineTo(w / 2 - 12, h / 2); g.lineTo(-w / 2 + 12, h / 2); g.closePath(); g.fill();
  g.fillStyle = BLEU; g.fillRect(-w / 2 + 6, -h / 2 + 40, w - 12, 28);
  g.fillStyle = ORANGE; g.beginPath(); g.roundRect(-w * .32, -h / 2, w * .64, 46, 10); g.fill();
  g.fillStyle = ORANGE; g.beginPath(); g.arc(0, -h * .02, w * .3, 0, Math.PI * 2); g.fill();
  g.strokeStyle = ORANGE; g.lineWidth = 8; g.lineCap = 'round'; for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; g.beginPath(); g.moveTo(Math.cos(a) * w * .36, -h * .02 + Math.sin(a) * w * .36); g.lineTo(Math.cos(a) * w * .46, -h * .02 + Math.sin(a) * w * .46); g.stroke(); }
  txt('SPF 50', 0, h * .25, { s: w * .26, col: BLEU });
  g.restore();
}
function hat(w) { // chapeau de soleil (bob à large bord)
  g.save(); g.fillStyle = '#f3d9a4'; g.beginPath(); g.ellipse(0, w * .12, w / 2, w * .17, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#d9b46a'; g.lineWidth = 6; g.beginPath(); g.ellipse(0, w * .12, w / 2 - 14, w * .17 - 10, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#f7e2b5'; g.beginPath(); g.moveTo(-w * .26, w * .1); g.bezierCurveTo(-w * .26, -w * .32, w * .26, -w * .32, w * .26, w * .1); g.closePath(); g.fill();
  g.fillStyle = BLEU; g.beginPath(); g.moveTo(-w * .265, w * .02); g.lineTo(w * .265, w * .02); g.lineTo(w * .26, w * .1); g.lineTo(-w * .26, w * .1); g.closePath(); g.fill();
  g.restore();
}
function plasticBag(h) {
  const w = h * .7; g.fillStyle = 'rgba(235,240,244,.96)'; g.strokeStyle = GREY_D; g.lineWidth = h * .03;
  g.beginPath(); g.moveTo(-w / 2, -h * .2); g.lineTo(-w * .32, -h / 2); g.lineTo(-w * .14, -h / 2); g.lineTo(-w * .1, -h * .25); g.lineTo(w * .1, -h * .25); g.lineTo(w * .14, -h / 2); g.lineTo(w * .32, -h / 2); g.lineTo(w / 2, -h * .2); g.lineTo(w * .46, h / 2); g.lineTo(-w * .46, h / 2); g.closePath(); g.fill(); g.stroke();
}
const STK = {};
function makeSticker(key, size, fn, border = 16) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size; const cx = cv.getContext('2d');
  const prev = g; g = cx; g.translate(size / 2, size / 2); fn(); g = prev;
  const sil = document.createElement('canvas'); sil.width = sil.height = size; const sx = sil.getContext('2d');
  sx.drawImage(cv, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = WH; sx.fillRect(0, 0, size, size);
  const out = document.createElement('canvas'); out.width = out.height = size + border * 2; const ox = out.getContext('2d');
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; ox.drawImage(sil, border + Math.cos(a) * border, border + Math.sin(a) * border); }
  ox.drawImage(cv, border, border); STK[key] = out;
}
function sticker(key, x, y, { rot = 0, sc = 1, id = 0, shadow = true } = {}) {
  const s = STK[key]; if (!s || sc <= 0) return;
  g.save(); g.translate(x + jit(id, 2.5), y + jit(id + 3, 2.5)); g.rotate(rot + jit(id + 7, .015)); g.scale(sc, sc);
  if (shadow) { g.shadowColor = 'rgba(0,20,50,.35)'; g.shadowBlur = 14; g.shadowOffsetY = 8; }
  g.drawImage(s, -s.width / 2, -s.height / 2); g.restore();
}

// ---------------------------------------------------------------- cartes
// Une carte apparaît d'un coup (1 image à 106 %, puis posée), de travers, et reste sous les suivantes.
function cardFrame(w, h, bg, deco) {
  g.save(); g.shadowColor = 'rgba(60,30,0,.35)'; g.shadowBlur = 26; g.shadowOffsetY = 12; g.fillStyle = bg; g.fillRect(-w / 2, -h / 2, w, h); g.restore();
  g.save(); g.beginPath(); g.rect(-w / 2, -h / 2, w, h); g.clip(); if (deco) deco(w, h);
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = .5; g.drawImage(GRAIN, -w / 2, -h / 2, w, h); g.restore();
}
function photoIn(im, w, h, zoom = 1, fx = .5, fy = .5) {
  g.save(); g.beginPath(); g.rect(-w / 2, -h / 2, w, h); g.clip();
  const s = Math.max(w / im.width, h / im.height) * zoom, iw = im.width * s, ih = im.height * s;
  g.drawImage(im, -w / 2 - (iw - w) * fx, -h / 2 - (ih - h) * fy, iw, ih); g.restore();
}
const CW = 860, CH = 1100, CX = W / 2, CY = 940;
// contenu de chaque carte : u = temps local (s depuis l'apparition)
const CARDS = {
  edition: { bg: WH, deco: () => rays('#e3ecff'), draw: u => {
      bigWord('2e', 0, -150, 420, { col: ORANGE, depthCol: NAVY, outline: NAVY, depth: 26, id: 21 });
      bigWord('ÉDITION', 0, 220, 230, { col: BLEU, depthCol: NAVY, outline: WH, depth: 16, id: 22 });
      sparkle(-320, -380, 56, ORANGE, 21); sparkle(320, -300, 40, BLEU, 22); sparkle(300, 420, 50, ORANGE, 23); } },
  plateau: { bg: WH, draw: u => {
      photoIn(PLATEAU, CW - 50, CH - 50, 1.08 + u * .15, .35, .55);
      torn(-120, -420, 520, 120, { rot: -.05, col: ORANGE, seed: 85 }, () => txt('stands gourmands', 0, 2, { f: 'Caveat', s: 78, col: NAVY }));
      if (u > .35) torn(180, 420, 300, 110, { rot: .06, seed: 86 }, () => txt('miam !', 0, 2, { f: 'Caveat', s: 90, col: NAVY }));
      sparkle(330, -300, 50, WH, 24); } },

function drawCard(key, t0, T, idx, { top = true } = {}) {
  const c = CARDS[key], u = T - t0, rot = ROT[idx % ROT.length];
  const pop = top && u < 1 / FPS_ANIM + 1e-6 ? 1.07 : 1;            // une image de rebond à l'arrivée
  const push = top ? 1 + Math.min(u, 1.4) * .025 : 1;                 // léger zoom caméra pendant la lecture
  g.save(); g.translate(CX + (hash(idx, 1) - .5) * 40 + jit(idx * 3, 2), CY + (hash(idx, 2) - .5) * 30 + jit(idx * 3 + 1, 2)); g.rotate(rot + jit(idx * 3 + 2, .004)); g.scale(pop * push, pop * push);
  cardFrame(CW, CH, c.bg, c.deco);
  if (top || idx >= 0) { g.save(); g.beginPath(); g.rect(-CW / 2, -CH / 2, CW, CH); g.clip(); c.draw(u); g.restore(); }
  g.restore();
}
function runStack(run, T, base) {
  let cur = -1; run.forEach(([t0], i) => { if (T >= t0) cur = i; });
  for (let i = Math.max(0, cur - 3); i <= cur; i++) drawCard(run[i][2], run[i][0], T, base + i, { top: i === cur });
}

// ---------------------------------------------------------------- entrée : photo instantanée sous film protecteur
function entry(T) {
  const pw = 720, ph = 1000, phx = 640, phy = 700;           // cadre et fenêtre photo
  g.save(); g.translate(CX - 20 + jit(1, 1.5), 900 + jit(2, 1.5)); g.rotate(-.05 + jit(3, .003));
  g.save(); g.shadowColor = 'rgba(60,30,0,.35)'; g.shadowBlur = 26; g.shadowOffsetY = 12; g.fillStyle = CREAM; g.fillRect(-pw / 2, -ph / 2, pw, ph); g.restore();
  g.save(); g.beginPath(); g.rect(-pw / 2, -ph / 2, pw, ph); g.clip(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = .5; g.drawImage(GRAIN, -pw / 2, -ph / 2, pw, ph); g.restore();
  const wy = -ph / 2 + 40, wx = -phx / 2;
  g.save(); g.translate(0, wy + phy / 2); photoIn(FEMME, phx, phy, 1.02 + lin(T, 1, 3.4) * .05, .45, .3); g.restore();
  // mentions imprimées sur le bord du film (détail instantané)
  g.save(); g.translate(-pw / 2 + 20, -ph / 2 + 120); g.rotate(Math.PI / 2); txt('TATABÉ · 17 · 10', 0, 0, { f: 'Anton', s: 22, col: '#9b8f78', align: 'left' }); g.restore();
  txt('M\'TSANGAMOUJI', 0, ph / 2 - 90, { f: 'Caveat', s: 56, col: '#7a6e58' });
  // film protecteur : couvre la photo, se décolle en pli diagonal entre 0,55 et 1,05 s, puis s'envole
  const p = lin(T, hb(1), hb(2) + .2), gone = T >= hb(2) + .3;
  if (!gone) {
    const top = wy, bot = wy + phy, L = wx, R = wx + phx;
    const xf = y => mix(R + 40, L - 260, eOut(p)) + (y - top) * .32 * (p > 0 ? 1 : 0);
    // partie encore collée
    g.save(); g.beginPath(); g.moveTo(L, top); g.lineTo(Math.min(R, xf(top)), top); g.lineTo(Math.min(R, xf(bot)), bot); g.lineTo(L, bot); g.closePath();
    g.fillStyle = 'rgba(214,224,226,.93)'; g.fill();
    const sh = g.createLinearGradient(L, top, R, bot); sh.addColorStop(0, 'rgba(255,255,255,.35)'); sh.addColorStop(.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(255,255,255,.25)'); g.fillStyle = sh; g.fill(); g.restore();
    // languette
    if (p <= 0) { g.fillStyle = '#eef2f2'; g.fillRect(R - 18, top + phy * .55, 34, 60); }
    // rabat replié (reflet de la partie décollée par rapport au pli)
    if (p > 0) {
      const a1 = [xf(top), top], a2 = [xf(bot), bot];
      const b1 = [2 * xf(top) - R, top], b2 = [2 * xf(bot) - R, bot];
      g.save(); g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 18; g.shadowOffsetX = 10;
      g.beginPath(); g.moveTo(...a1); g.lineTo(...b1); g.lineTo(...b2); g.lineTo(...a2); g.closePath();
      const fg = g.createLinearGradient(a1[0], 0, b1[0], 0); fg.addColorStop(0, '#f4f7f7'); fg.addColorStop(1, '#c3cfd2'); g.fillStyle = fg; g.fill(); g.restore();
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 4; g.beginPath(); g.moveTo(...a1); g.lineTo(...a2); g.stroke();
    }
  }
  // stickers posés sur la photo
  if (T >= 1.62) { // bulle « Karibu ! »
    g.save(); g.translate(-170 + jit(41, 2), -330 + jit(42, 2)); g.rotate(-.06);
    g.fillStyle = WH; g.strokeStyle = NAVY; g.lineWidth = 5; g.beginPath(); g.roundRect(-130, -55, 260, 110, 55); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-40, 50); g.lineTo(-70, 95); g.lineTo(0, 52); g.fillStyle = WH; g.fill(); g.stroke();
    txt('Karibu !', 0, 2, { f: 'Caveat', s: 70, col: NAVY }); g.restore();
  }
  if (T >= 2.0) torn(110, 290, 430, 100, { rot: .04, seed: 44 }, () => { txt('c\'est reparti !', -10, 0, { f: 'Caveat', s: 66, col: NAVY }); });
  hand(ellipsePts(110, 292, 240, 70, 1.05, -2.8), lin(T, 2.05, 2.45), { col: ORANGE, w: 7, seed: 45 });
  g.restore();
  // logo tataBé « tapé » lettre à lettre (révélé de gauche à droite, une lettre par image) + curseur
  if (T >= 1.1) {
    const CUTS = [.17, .30, .44, .60, .82, 1.0], n = Math.min(CUTS.length, Math.floor((T - 1.1) * 12 + 1e-6) + 1);
    const lw = 860, lh = LOGO_W.height * lw / LOGO_W.width, lx = CX - lw / 2, ly = 245 - lh / 2;
    g.save(); g.beginPath(); g.rect(lx - 10, ly - 20, lw * CUTS[n - 1] + 10, lh + 40); g.clip(); g.drawImage(LOGO_W, lx + jit(51, 1.5), ly + jit(52, 1.5), lw, lh); g.restore();
    if (n < CUTS.length || (STEP % 2 === 0 && T < 2.0)) { g.fillStyle = WH; g.fillRect(lx + lw * CUTS[n - 1] + 12, ly + lh * .3, 24, lh * .62); }
  }
  // étiquette tapée en haut à droite
  if (T >= 1.8) { const s = 'le marché gourmand', k = Math.min(s.length, Math.floor((T - 1.8) * 30) + 1); torn(790, 455, 470, 92, { rot: .03, seed: 46 }, () => txt(s.slice(0, k), -205, 2, { f: 'Caveat', s: 60, col: NAVY, align: 'left' })); }
  hand(swirlPts(110, 760, 70), lin(T, 2.2, 2.6), { col: WH, w: 7, seed: 47 });
  // mots du bas, un par un
  const words = [['REVIENT', 2.4, WH], ['!', 2.75, ORANGE]];
  let x = 0; g.save(); setFont('Anton', 190); const widths = words.map(w => g.measureText(w[0] + ' ').width); g.restore();
  const tot = widths.reduce((a, b) => a + b, 0); x = CX - tot / 2;
  words.forEach(([w, t0, col], i) => { if (T >= t0) txt(w, x + jit(60 + i, 2), 1560 + jit(70 + i, 2), { s: 190, col, align: 'left', stroke: col === ORANGE ? 14 : 0, strokeCol: NAVY }); x += widths[i]; });
}

// ---------------------------------------------------------------- pause objet : tout dans le sac
function objectBeat(T) {
  const u = T - OBJ[0];
  txt('&', 170, 360, { f: 'Anton', s: 220, col: ORANGE });
  txt('voilà', 280, 310, { f: 'Caveat', s: 100, col: WH, align: 'left' });
  txt('ton kit !', 340, 410, { f: 'Caveat', s: 100, col: WH, align: 'left' });
  const bx = CX, by = 1050, bw = 640;
  g.save(); g.translate(bx + jit(91, 2), by + jit(92, 2)); g.rotate(-.04); tote(bw, 'back', ORANGE); g.restore();
  [['plate', .2, -60], ['fork', .38, 40], ['spoon', .56, -20], ['cup', .74, 70]].forEach(([k, t0, dx], i) => {
    const q = lin(u, t0 - .22, t0); if (q <= 0 || q >= 1) return;
    sticker(k, bx + dx * q + mix(320 * (i % 2 ? 1 : -1), 0, q), mix(380, by + 120, q * q), { rot: (1 - q) * (i % 2 ? .6 : -.6), sc: .85, id: 93 + i });
  });
  g.save(); g.translate(bx + jit(91, 2), by + jit(92, 2)); g.rotate(-.04); tote(bw, 'front'); g.restore();
  // traits de mouvement autour du sac
  if (u > .2 && u < 1.0) { g.save(); g.strokeStyle = WH; g.lineWidth = 7; g.lineCap = 'round'; [[-1, -1], [1, -1], [-1, .3], [1, .3]].forEach(([sx, sy], i) => { const r0 = 330 + (STEP % 2) * 12; g.beginPath(); g.moveTo(bx + sx * r0, by + sy * 220); g.lineTo(bx + sx * (r0 + 60), by + sy * 250); g.stroke(); }); g.restore(); }
  if (u >= .95) { g.save(); g.translate(bx + 220, by - 140); const k = u < 1.04 ? 1.2 : 1; g.scale(k, k); g.fillStyle = ORANGE; g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.fill(); g.strokeStyle = WH; g.lineWidth = 16; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-30, 2); g.lineTo(-9, 26); g.lineTo(32, -24); g.stroke(); g.restore(); }
  const words = [['tout', .9], ['dans', 1.05], ['ton sac !', 1.2]];
  let x = 230; words.forEach(([w, t0]) => { if (u >= t0) txt(w, x, 1620, { f: 'Caveat', s: 100, col: WH, align: 'left' }); g.save(); setFont('Caveat', 100); x += g.measureText(w + ' ').width; g.restore(); });
}

// ---------------------------------------------------------------- carte finale (tenue, lisible)
function finalCard(T) {
  // directement sur le fond bleu : logo blanc, date, lieu, appel à l'action — rien d'autre
  const u = T - FINAL_T;
  const typed = (str, t0, rate = 24) => str.slice(0, Math.max(0, Math.min(str.length, Math.floor((u - t0) * rate + 1e-6) + 1)));
  const pop = u < 1 / FPS_ANIM + 1e-6 ? 1.12 : 1;
  g.save(); g.translate(CX, 0);
  { const lw = 900 * pop, lh = LOGO_W.height * lw / LOGO_W.width; g.drawImage(LOGO_W, -lw / 2, 470 - lh / 2, lw, lh); }
  if (u >= .1) { const pw2 = 470, ph2 = PILL.height * pw2 / PILL.width; g.drawImage(PILL, 200 - pw2 / 2, 680 - ph2 / 2, pw2, ph2); }
  if (u >= .25) { const k = u < .25 + 1 / FPS_ANIM ? 1.25 : 1; g.save(); g.translate(-235, 880); g.rotate(-.1); g.scale(k, k);
    g.fillStyle = ORANGE; g.beginPath(); g.roundRect(-175, -82, 350, 164, 26); g.fill(); g.strokeStyle = NAVY; g.lineWidth = 6; g.setLineDash([14, 9]); g.beginPath(); g.roundRect(-160, -68, 320, 136, 18); g.stroke(); g.setLineDash([]);
    txt('SAM.', 0, -50, { s: 38, col: NAVY }); txt('17 OCT.', 0, 24, { s: 84, col: NAVY }); g.restore(); }
  if (u >= .45) txt(typed('10H – 18H', .45), -20, 880, { s: 116, col: WH, align: 'left' });
  if (u >= .7) txt(typed('MTSANGAMOUJI', .7), 0, 1050, { s: 140, col: WH, maxW: 900 });
  if (u >= 1.0) txt('plage · rue Koudjouni', 0, 1160, { f: 'Caveat', s: 72, col: WH });
  if (u >= 1.2) torn(0, 1360, 960, 180, { rot: -.035, col: ORANGE, seed: 71 }, () => txt('VIENS AVEC TON KIT !', 0, 4, { s: 116, col: NAVY, maxW: 880 }));
  g.restore();
}
function partnersCard(T) {
  const u = T - PART_T, w = 1000, h = 440, pop = u < 1 / FPS_ANIM + 1e-6 ? 1.08 : 1;
  g.save(); g.translate(CX, 960); g.rotate(-.015); g.scale(pop, pop); cardFrame(w, h, WH);
  txt('avec nos partenaires', 0, -150, { f: 'Caveat', s: 70, col: NAVY });
  const bw = 940, bh = PART.height * bw / PART.width; g.drawImage(PART, -bw / 2, h / 2 - bh - 20, bw, bh);
  g.restore();
}

// ================================================================ montage
function render(t) {
  const T = Math.floor(t * FPS_ANIM + 1e-6) / FPS_ANIM; STEP = Math.floor(t * FPS_ANIM + 1e-6);
  BOIL = T >= FINAL_T + 1.0 ? 0 : 1;
  g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(FOND, 0, 0, W, H);
  if (T < ENTRY_END) entry(T);
  else if (T < OBJ[0]) runStack(RUN1, T, 0);
  else if (T < OBJ[1]) objectBeat(T);
  else if (T < FINAL_T) runStack(RUN2, T, 20);
  else if (T < PART_T) finalCard(T);
  else partnersCard(T);
}

  makeSticker('plate', 400, () => plate(180));

  makeSticker('fork', 460, () => cutlery('fork', 430));
  makeSticker('spoon', 460, () => cutlery('spoon', 430));
  makeSticker('knife', 460, () => cutlery('knife', 430));
  makeSticker('cup', 560, () => cup(440), 20);
  makeSticker('tote', 620, () => tote(500), 18);
  makeSticker('towel', 640, () => towel(560), 18);
  makeSticker('sunscreen', 520, () => sunscreen(440), 18);
  makeSticker('hat', 640, () => hat(560), 18);
  render(0); window.ready = true;
});
