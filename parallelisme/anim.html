<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Barlow;src:url(../video/assets/BarlowCondensed-BlackItalic.ttf);font-weight:900}
@font-face{font-family:Montserrat;src:url(../video/assets/Montserrat.ttf);font-weight:100 900}
html,body{margin:0;background:#fff}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, DUR = 19;
const c = document.getElementById('c'), g = c.getContext('2d');
// Centre Auto Alonzo charter
const BLUE = '#084990', RED = '#E20816', WH = '#ffffff', INK = '#1d2a3f', GREY = '#5b6b82', JOY = '#FFD200';

// Scene boundaries (seconds), aligned with the voice-over
// Scenes: hook, walking analogy, wheel geometry, benefits, end card
const S = [0, 2.1, 6.8, 9.85, 15.05, DUR];

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

const IMG = {};
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; });

function text(str, x, y, { f = 'Barlow', w = 900, s = 60, col = INK, align = 'center', a = 1, ls = 0 } = {}) {
  g.save(); g.globalAlpha *= a; g.font = `${w} ${s}px ${f}`; g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle';
  if (ls) g.letterSpacing = ls + 'px';
  g.fillText(str, x, y); g.restore();
}
// Largest Barlow size (<= s) that keeps str within maxW
function fit(str, s, maxW) { g.save(); g.font = `900 ${s}px Barlow`; if (str.length) g.letterSpacing = '0px'; const w = g.measureText(str).width; g.restore(); return Math.min(s, Math.floor(s * maxW / w)); }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function revealText(str, x, y, t0, t, opts) {
  const p = eOut(lin(t, t0, t0 + .45));
  if (p <= 0) return;
  const s = opts.s || 60;
  g.save(); g.beginPath(); g.rect(0, y - s * .8, W, s * 1.6); g.clip();
  text(str, x, y + (1 - p) * s * 1.2, { ...opts, a: p });
  g.restore();
}
// Draw an image centred at (cx, cy) with a given width
function pic(k, cx, cy, w, { a = 1, rot = 0, sc = 1, shadow = 0 } = {}) {
  const i = IMG[k], h = w * i.height / i.width;
  g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.rotate(rot); g.scale(sc, sc);
  if (shadow) { g.shadowColor = 'rgba(8,40,90,.28)'; g.shadowBlur = shadow; g.shadowOffsetY = shadow * .35; }
  g.drawImage(i, -w / 2, -h / 2, w, h);
  g.restore();
}

// Logo swooshes (blue outer, red inner)
function swoosh(cx, cy, r, rot, p, wB = 22, wR = 22) {
  g.save(); g.translate(cx, cy); g.rotate(rot); g.lineCap = 'round';
  const a0 = Math.PI * .95, span = Math.PI * 1.15;
  g.strokeStyle = BLUE; g.lineWidth = wB;
  g.beginPath(); g.ellipse(0, 0, r * 1.08, r * .98, 0, a0, a0 + span * p); g.stroke();
  g.strokeStyle = RED; g.lineWidth = wR;
  g.beginPath(); g.ellipse(r * .06, 0, r * .9, r * .8, 0, a0 + .15, a0 + .15 + span * .95 * p); g.stroke();
  g.restore();
}

function background(t) {
  g.fillStyle = WH; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = .07; swoosh(W * .5, H * .42, 620, -.25 + t * .05, 1, 60, 60); g.restore();
}

// Shop logo on top during the middle scenes
function chrome(t) {
  const a = eOut(lin(t, S[1], S[1] + .4)) * (1 - eOut(lin(t, S[4] - .2, S[4] + .1)));
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  const lw = 210, lh = lw * IMG.logo.height / IMG.logo.width;
  g.drawImage(IMG.logo, W / 2 - lw / 2, 235 - 30 * (1 - a), lw, lh);
  g.restore();
}

function wipe(t, at) {
  const d = .42, p = lin(t, at - d / 2, at + d / 2);
  if (p <= 0 || p >= 1) return;
  const x = -W * 1.2 + eInOut(p) * W * 3.0;
  g.save(); g.translate(x, 0); g.transform(1, 0, -.3, 1, 0, 0);
  g.fillStyle = BLUE; g.fillRect(0, 0, 260, H * 1.2);
  g.fillStyle = RED; g.fillRect(-110, 0, 70, H * 1.2);
  g.restore();
}
const sceneOut = (t, end) => 1 - eIn(lin(t, end - .22, end));

// Slanted label (red by default)
function tag(label, x, y, p, { col = RED, txt = WH, s = 58, w = null } = {}) {
  if (p <= 0) return;
  g.save(); g.font = `900 ${s}px Barlow`; const tw = w || g.measureText(label).width + 70; g.restore();
  g.save(); g.translate(x, y); g.scale(p, p);
  g.save(); g.transform(1, 0, -.25, 1, 0, 0); g.fillStyle = col; g.fillRect(-tw / 2, -s * .82, tw, s * 1.64); g.restore();
  text(label, 0, 2, { s, col: txt, ls: 1 });
  g.restore();
}

function check(x, y, s, col = BLUE) {
  if (s <= 0) return;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = col; g.beginPath(); g.arc(0, 0, 46, 0, Math.PI * 2); g.fill();
  g.strokeStyle = WH; g.lineWidth = 10; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-18, 2); g.lineTo(-5, 15); g.lineTo(20, -12); g.stroke();
  g.restore();
}
function cross(x, y, s, col = RED) {
  if (s <= 0) return;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = col; g.beginPath(); g.arc(0, 0, 46, 0, Math.PI * 2); g.fill();
  g.strokeStyle = WH; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-15, -15); g.lineTo(15, 15); g.moveTo(15, -15); g.lineTo(-15, 15); g.stroke();
  g.restore();
}
function axle(k, cx, cy, w, p, opts = {}) { if (p > 0) pic(k, cx, cy, w, { a: clamp(p * 2), sc: .7 + .3 * p, ...opts }); }

// ---------- Hook ----------
function hook(t) {
  g.save(); g.globalAlpha = sceneOut(t, S[1]);
  revealText('GARDE TES', W / 2, 470, -.2, t, { s: 170, col: BLUE });
  revealText('ROUES DROITES', W / 2, 630, -.05, t, { s: fit('ROUES DROITES', 170, 820), col: BLUE });
  revealText('GARDE LE CAP !', W / 2, 800, .5, t, { s: 150, col: RED });
  const ap = eBack(lin(t, .3, .8)), y = 1130 + (1 - eOut(lin(t, .3, .8))) * 300;
  if (ap > 0) {
    // straight heading lines in front of each wheel
    const lp = eOut(lin(t, .9, 1.5));
    g.save(); g.strokeStyle = BLUE; g.lineWidth = 8; g.setLineDash([30, 22]); g.lineDashOffset = t * 140;
    for (const dx of [-330, 330]) { g.beginPath(); g.moveTo(W / 2 + dx, y - 110); g.lineTo(W / 2 + dx, y - 110 - 110 * lp); g.stroke(); }
    g.restore();
    pic('axle-correct', W / 2, y, 780, { a: clamp(ap * 2), sc: .8 + .2 * ap, shadow: 30 });
    check(W / 2, y + 190, eBack(lin(t, 1.3, 1.6)));
  }
  g.restore();
}

// ---------- Walking analogy ----------
// Front view of a pair of legs. bent=0 straight, bent=1 bow-legged.
function legs(cx, cy, t, bent, p) {
  if (p <= 0) return;
  const ph = t * 5.5;
  const sway = bent ? Math.sin(ph) * .09 + Math.sin(ph * 2.3) * .03 : 0;
  const bob = bent ? Math.abs(Math.sin(ph)) * 14 : Math.abs(Math.sin(ph)) * 6;
  g.save(); g.translate(cx, cy + 330); g.rotate(sway); g.translate(0, -330 - bob); g.scale(p, p);
  // shorts
  rrect(-95, -60, 190, 120, 26); g.fillStyle = BLUE; g.fill();
  g.fillStyle = RED; g.fillRect(-95, -22, 190, 12);
  for (const side of [-1, 1]) {
    const lift = Math.max(0, Math.sin(ph + (side > 0 ? Math.PI : 0))) * 34;
    const hx = side * 50, fx = side * (bent ? 30 : 50), fy = 330 - lift;
    const kx = side * (50 + bent * 95), ky = 160 - lift * .5;
    g.strokeStyle = '#c98e64'; g.lineWidth = 46; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(hx, 40); g.quadraticCurveTo(kx, ky, fx, fy); g.stroke();
    // shoe
    g.save(); g.translate(fx, fy + 18); g.rotate(bent ? -side * .35 : 0);
    rrect(-38, -16, 76, 34, 14); g.fillStyle = RED; g.fill();
    g.fillStyle = WH; g.fillRect(-38, 10, 76, 6);
    g.restore();
  }
  g.restore();
  // ground shadow
  g.save(); g.globalAlpha *= .15 * p; g.fillStyle = INK; g.beginPath(); g.ellipse(cx, cy + 370, 130, 18, 0, 0, Math.PI * 2); g.fill(); g.restore();
}
function walk(t) {
  const t0 = S[1];
  g.save(); g.globalAlpha = sceneOut(t, S[2]);
  revealText('C’EST COMME', W / 2, 500, t0 + .05, t, { s: 92, col: BLUE });
  revealText('QUAND VOUS MARCHEZ', W / 2, 595, t0 + .15, t, { s: fit('QUAND VOUS MARCHEZ', 92, 860), col: BLUE });
  const p1 = eBack(lin(t, 2.25, 2.7)), p2 = eBack(lin(t, 4.85, 5.3));
  legs(300, 760, t, 0, p1);
  legs(780, 760, t, 1, p2);
  if (p1 > 0) { text('DROITES', 300, 1230, { s: 80, col: BLUE, a: clamp(p1) }); check(300, 1340, eBack(lin(t, 3.2, 3.5))); }
  if (p2 > 0) { text('TORDUES', 780, 1230, { s: 80, col: RED, a: clamp(p2) }); cross(780, 1340, eBack(lin(t, 5.6, 5.9))); }
  text('On avance facilement', 300, 1420, { f: 'Montserrat', w: 600, s: 30, col: GREY, a: eOut(lin(t, 3.3, 3.7)) });
  text('Démarche bancale', 780, 1420, { f: 'Montserrat', w: 600, s: 30, col: GREY, a: eOut(lin(t, 5.7, 6.1)) });
  g.restore();
}

// ---------- Wheel geometry ----------
function geometry(t) {
  const t0 = S[2];
  g.save(); g.globalAlpha = sceneOut(t, S[3]);
  revealText('POUR VOS ROUES,', W / 2, 480, t0 + .05, t, { s: 84, col: BLUE });
  revealText('C’EST PAREIL !', W / 2, 565, t0 + .15, t, { s: 84, col: RED });
  const cp = eBack(lin(t, t0 + .25, t0 + .65));
  axle('axle-correct', W / 2, 760, 600, cp, { shadow: 24 });
  tag('GÉOMÉTRIE CORRECTE', W / 2 - 40, 900, eBack(lin(t, t0 + .45, t0 + .8)), { col: BLUE, s: 40 });
  check(W / 2 + 250, 900, eBack(lin(t, t0 + .7, t0 + 1.0)));
  const D = [['axle-contre', 'CONTRE-CARROSSAGE', 290, 1080], ['axle-carrossage', 'CARROSSAGE', 790, 1080],
             ['axle-pincement', 'PINCEMENT', 290, 1300], ['axle-ouverture', 'OUVERTURE', 790, 1300]];
  D.forEach(([k, label, x, y], i) => {
    const at = t0 + 1.1 + i * .22, p = eBack(lin(t, at, at + .35));
    axle(k, x, y, 360, p);
    tag(label, x, y + 92, eBack(lin(t, at + .1, at + .4)), { s: 32 });
    cross(x + 170, y - 60, eBack(lin(t, at + .25, at + .5)) * .7);
  });
  g.restore();
}

// ---------- Benefits ----------
function benefitIcon(kind, x, y, p) {
  if (p <= 0) return;
  g.save(); g.translate(x, y); g.scale(p, p);
  g.fillStyle = kind === 1 ? RED : BLUE; g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.fill();
  g.strokeStyle = WH; g.fillStyle = WH; g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 0) { // tire
    g.lineWidth = 12; g.beginPath(); g.arc(0, 0, 38, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 6; g.beginPath(); g.arc(0, 0, 16, 0, Math.PI * 2); g.stroke();
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.beginPath(); g.moveTo(Math.cos(a) * 44, Math.sin(a) * 44); g.lineTo(Math.cos(a) * 50, Math.sin(a) * 50); g.stroke(); }
  } else if (kind === 1) { // straight road
    g.beginPath(); g.moveTo(-14, -42); g.lineTo(14, -42); g.lineTo(40, 42); g.lineTo(-40, 42); g.closePath(); g.fill();
    g.strokeStyle = RED; g.lineWidth = 6; g.setLineDash([12, 10]); g.beginPath(); g.moveTo(0, -38); g.lineTo(0, 40); g.stroke(); g.setLineDash([]);
  } else { // fuel drop
    g.beginPath(); g.moveTo(0, -46); g.bezierCurveTo(30, -10, 36, 8, 36, 18); g.arc(0, 18, 36, 0, Math.PI); g.bezierCurveTo(-36, 8, -30, -10, 0, -46); g.fill();
    g.fillStyle = BLUE; text('–', 0, 16, { f: 'Montserrat', w: 900, s: 50, col: BLUE });
  }
  g.restore();
}
function benefits(t) {
  const t0 = S[3];
  g.save(); g.globalAlpha = sceneOut(t, S[4]);
  revealText('UN BON', W / 2, 500, t0 + .05, t, { s: 96, col: BLUE });
  revealText('PARALLÉLISME, C’EST :', W / 2, 600, t0 + .15, t, { s: fit('PARALLÉLISME, C’EST :', 96, 880), col: RED });
  const rows = [['DES PNEUS QUI DURENT', 'Comme des jambes bien alignées', 10.05], ['UNE VOITURE STABLE', 'Comme quand on marche droit', 12.35], ['DU CARBURANT ÉCONOMISÉ', 'Avancer sans effort en plus', 13.55]];
  rows.forEach(([a, b, at], i) => {
    const y = 820 + i * 210, p = eBack(lin(t, at, at + .35));
    benefitIcon(i, 190, y, p);
    const tp = eOut(lin(t, at + .05, at + .4));
    if (tp > 0) {
      g.save(); g.globalAlpha *= tp; g.translate(-40 * (1 - tp), 0);
      text(a, 290, y - 22, { s: fit(a, 76, 610), col: BLUE, align: 'left' });
      text(b, 292, y + 40, { f: 'Montserrat', w: 600, s: 34, col: GREY, align: 'left' });
      g.restore();
    }
  });
  g.restore();
}

// ---------- Outro ----------
function outro(t) {
  const t0 = S[4];
  const bp = eOut(lin(t, t0, t0 + .4));
  g.fillStyle = BLUE; g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, 820 * bp); g.quadraticCurveTo(W / 2, 980 * bp, 0, 820 * bp); g.closePath(); g.fill();
  const lp = eBack(lin(t, t0 + .15, t0 + .6));
  if (lp > 0) {
    g.save(); g.translate(W / 2, 650); g.scale(lp, lp); g.rotate((1 - lp) * -.2);
    g.shadowColor = 'rgba(0,20,60,.35)'; g.shadowBlur = 50; g.shadowOffsetY = 16;
    g.fillStyle = WH; g.beginPath(); g.ellipse(0, 0, 340, 300, -.12, 0, Math.PI * 2); g.fill();
    g.shadowColor = 'transparent';
    const lw = 580, lh = lw * IMG.logo.height / IMG.logo.width;
    g.drawImage(IMG.logo, -lw / 2, -lh / 2, lw, lh);
    g.restore();
  }
  revealText('ROULEZ DROIT', W / 2, 290, t0 + .15, t, { s: 96, col: WH });
  revealText('EN TOUTE SÉCURITÉ !', W / 2, 1060, t0 + .4, t, { s: 84, col: RED });
  const pr = eOut(lin(t, t0 + .55, t0 + .95));
  if (pr > 0) {
    g.save(); g.globalAlpha = pr; g.translate(-60 * (1 - pr), 0);
    const pulse = 1 + Math.sin((t - t0) * 7) * .04 * lin(t, t0 + 1.3, t0 + 1.6);
    g.save(); g.translate(190, 1210); g.scale(pulse * .87, pulse * .87);
    g.fillStyle = BLUE; g.beginPath(); g.arc(0, 0, 92, 0, Math.PI * 2); g.fill();
    g.rotate(.8); g.strokeStyle = WH; g.fillStyle = WH; g.lineCap = 'round';
    g.lineWidth = 20; g.beginPath(); g.arc(22, 0, 44, Math.PI * .62, Math.PI * 1.38); g.stroke();
    for (const sy of [-1, 1]) { g.save(); g.translate(22 + Math.cos(Math.PI * (1 + .38 * sy)) * 44, Math.sin(Math.PI * (1 + .38 * sy)) * 44); g.rotate(sy * .3); rrect(-10, -16, 40, 32, 10); g.fill(); g.restore(); }
    g.restore();
    text('APPELEZ-NOUS', 310, 1170, { f: 'Montserrat', w: 600, s: 46, col: BLUE, align: 'left' });
    text('+262 639 291 702', 308, 1250, { f: 'Montserrat', w: 800, s: 64, col: BLUE, align: 'left' });
    g.restore();
  }
  const ar = eOut(lin(t, t0 + .75, t0 + 1.15));
  if (ar > 0) {
    g.save(); g.globalAlpha = ar; g.translate(-60 * (1 - ar), 0);
    g.save(); g.translate(190, 1385 - 14 * Math.abs(Math.sin((t - t0) * 5)) * lin(t, t0 + 1.4, t0 + 1.6));
    g.fillStyle = RED; g.beginPath(); g.arc(0, -20, 46, Math.PI * .85, Math.PI * 2.15); g.lineTo(0, 62); g.closePath(); g.fill();
    g.fillStyle = WH; g.beginPath(); g.arc(0, -20, 18, 0, Math.PI * 2); g.fill();
    g.restore();
    text('32 Route de Coconi', 310, 1345, { f: 'Montserrat', w: 500, s: 46, col: INK, align: 'left' });
    text('COMBANI', 310, 1412, { f: 'Montserrat', w: 800, s: 54, col: BLUE, align: 'left' });
    g.restore();
  }
}

function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  if (t < S[1]) hook(t);
  else if (t < S[2]) walk(t);
  else if (t < S[3]) geometry(t);
  else if (t < S[4]) benefits(t);
  else outro(t);
  chrome(t);
  for (let i = 1; i < S.length - 1; i++) wipe(t, S[i]);
}
window.render = render;
Promise.all([
  document.fonts.load('900 40px Barlow'), document.fonts.load('600 40px Montserrat'), document.fonts.load('800 40px Montserrat'),
  load('logo', '../video/assets/logo.png'),
  ...['axle-correct', 'axle-contre', 'axle-carrossage', 'axle-pincement', 'axle-ouverture'].map(k => load(k, `assets/${k}.png`)),
]).then(() => { render(0); window.ready = true; });
</script>
</body></html>
