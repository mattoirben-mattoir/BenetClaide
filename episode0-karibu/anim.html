<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Barlow;src:url(../video/assets/BarlowCondensed-BlackItalic.ttf);font-weight:900}
@font-face{font-family:Montserrat;src:url(../video/assets/Montserrat.ttf);font-weight:100 900}

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../video/set-garage.js"></script>
<script>
// V3 — "3 conseils pneus" told as a short story: one hero tire, one mechanic who acts on it.
// "Garde tes roues droites" told with the mechanic: he walks it, then fixes the wheels.
// Épisode 0 « Karibu ! » — the manager's real greeting turns into the series mascot.
const W = 1080, H = 1920;
const c = document.getElementById('c'); let g = c.getContext('2d');
const BLUE = '#084990', RED = '#E20816', WH = '#ffffff', INK = '#1d2a3f', GREY = '#5b6b82';
// colour script (AD): warm skin with light + shade, navy ink line on every part, brand blue tee vs deep navy trousers
const SKIN = '#7b4a2b', SKIN_D = '#55301a', SKIN_HI = '#a06a45', NAVY = '#1d2b55', NAVY_D = '#141f40';
const INKL = '#121c36', LIPS = '#4a1712', GLASS = '#0b0d11', MIC = '#f2782a', LEAF = '#5aa832', TEE_D = '#063b75';
// Alonzo's look, from his photos: shaved head, sunglasses up on the head, short black beard, slim.
// Top: 'ville' = white shirt (what he wears in the Karibu footage), 'atelier' = navy work tee with the logo.
// Episode 0: he arrives in his shirt, then pulls the work tee on over it (~9.5 s). Navy trousers + loafers throughout.
let LOOK = 'ville', SHIRT = '#ffffff', SHIRT_D = '#e2e8f1';
const BEARD = '#15100d', PANTS = '#1c2647';
function setLook(l) { LOOK = l; SHIRT = l === 'ville' ? '#ffffff' : BLUE; SHIRT_D = l === 'ville' ? '#e2e8f1' : TEE_D; }
const DRESS = [9.6, 10.0];       // work outfit sweeps on, head to feet: tee, cargo trousers, work shoes
const SWAP = [13.5, 14.0];       // last shot: he tosses the mic, it comes down as a wrench
const DUR = 17.4;
const S = [0, DUR];
const sceneOf = () => 0, onBlue = () => false;   // single-scene episode (used by shared drawing code)

// ---------------------------------------------------------------- sound
const BABBLE = (at, n, base = .85) => Array.from({ length: n }, (_, i) => [at + i * .11, 'blip', { pitch: base + ((i * 7) % 5) * .09 }]);
const SFX0 = [
  [0.2, 'pop'], [3.2, 'swoosh'], [1.98, 'snap'], [2.0, 'impact'], [2.1, 'swoosh'], [2.2, 'riser', { d: .55 }], [2.75, 'ding'], [3.0, 'pop', { pitch: 1.2 }],
  ...BABBLE(3.7, 6), [5.6, 'swoosh'], [5.62, 'whoosh'], [6.13, 'tick'],
  [6.2, 'roll', { d: .9 }], [6.25, 'whoosh'], [6.9, 'screech', { d: .5 }], [7.2, 'honk'], [7.5, 'honk'], ...BABBLE(7.65, 6, .62),
  [8.25, 'tick'], ...BABBLE(9.0, 7), [9.38, 'whoosh'], [9.6, 'swoosh'], [9.98, 'pop', { pitch: 1.25 }],
  [10.0, 'jingle'], [10.02, 'impact'], [10.6, 'swoosh'],
  [13.5, 'whoosh'], [13.75, 'pop', { pitch: .8 }], [14.0, 'ding'],
  ...BABBLE(14.35, 10), [14.6, 'pop', { pitch: 1.3 }], [15.05, 'pop', { pitch: 1.1 }],
];

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
let LOGO;

function text(str, x, y, { f = 'Barlow', w = 900, s = 60, col = INK, align = 'center', a = 1 } = {}) {
  g.save(); g.globalAlpha *= a; g.font = `${w} ${s}px ${f}`; g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle';
  g.fillText(str, x, y); g.restore();
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function fit(str, s, maxW) { g.save(); g.font = `900 ${s}px Barlow`; const w = g.measureText(str).width; g.restore(); return Math.min(s, Math.floor(s * maxW / w)); }
// word that lands with a scale punch
function punch(str, x, y, t0, t, s, col) {
  const p = lin(t, t0, t0 + .28); if (p <= 0) return;
  const k = 1 + .7 * (1 - eBack(p));
  g.save(); g.translate(x, y); g.scale(k, k); text(str, 0, 0, { s, col, a: clamp(p * 3) }); g.restore();
}
// key phrase on a slanted marker band
function marker(str, x, y, t0, t, s, bg, fg) {
  const p = eOut(lin(t, t0, t0 + .35)); if (p <= 0) return;
  g.save(); g.font = `900 ${s}px Barlow`; const w = g.measureText(str).width + 60; g.restore();
  g.save(); g.translate(x - w / 2, y); g.transform(1, 0, -.25, 1, 0, 0);
  g.beginPath(); g.rect(0, -s * .62, w * p, s * 1.2); g.fillStyle = bg; g.fill(); g.clip();
  g.setTransform(1, 0, 0, 1, 0, 0); text(str, x, y + 4, { s, col: fg });
  g.restore();
}
function swooshBg(col, a, t) {
  g.save(); g.globalAlpha = a; g.translate(W * .5, H * .44); g.rotate(-.25 + t * .05); g.lineCap = 'round';
  const a0 = Math.PI * .95, span = Math.PI * 1.15;
  g.strokeStyle = col; g.lineWidth = 60; g.beginPath(); g.ellipse(0, 0, 670, 610, 0, a0, a0 + span); g.stroke();
  g.lineWidth = 60; g.beginPath(); g.ellipse(37, 0, 558, 496, 0, a0 + .15, a0 + .15 + span * .95); g.stroke();
  g.restore();
}

function check(x, y, s, col = BLUE) {
  if (s <= 0) return;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = col; g.beginPath(); g.arc(0, 0, 46, 0, Math.PI * 2); g.fill();
  g.strokeStyle = WH; g.lineWidth = 4; g.stroke();
  g.lineWidth = 10; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-18, 2); g.lineTo(-5, 15); g.lineTo(20, -12); g.stroke();
  g.restore();
}
function warning(x, y, s) {
  if (s <= 0) return;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = RED; g.strokeStyle = RED; g.lineJoin = 'round'; g.lineWidth = 16;
  g.beginPath(); g.moveTo(0, -58); g.lineTo(58, 46); g.lineTo(-58, 46); g.closePath(); g.stroke(); g.fill();
  text('!', 0, 10, { f: 'Montserrat', w: 900, s: 70, col: WH });
  g.restore();
}
function confetti(x, y, t, t0) {
  const r = t - t0; if (r < 0 || r > 1.4) return;
  const cols = [RED, '#ffd34d', WH, '#7fb2ff'];
  g.save(); g.globalAlpha = 1 - lin(r, .9, 1.4);
  for (let i = 0; i < 36; i++) {
    const a = (i * 137.5) * Math.PI / 180, sp = 380 + (i * 53 % 7) * 70;
    const px = x + Math.cos(a) * sp * r, py = y + Math.sin(a) * sp * r * .8 + 900 * r * r;
    g.save(); g.translate(px, py); g.rotate(r * (6 + i % 5)); g.fillStyle = cols[i % 4];
    g.fillRect(-9, -5, 18, 10); g.restore();
  }
  g.restore();
}



// ---------------------------------------------------------------- the mechanic: Alonzo
// Drawn from his photos (Karibu day): shaved head, sport sunglasses up on the head, short trimmed beard
// along the jaw + moustache, slim fitted white shirt with a cream flower, navy trousers, black belt,
// black patent loafers, orange foam microphone. Every part carries a navy ink line so it reads on any background.
// two-bone IK: elbow position for a hand target
function ik(sx, sy, tx, ty, a, b, bend) {
  const dx = tx - sx, dy = ty - sy, d = Math.min(Math.hypot(dx, dy), a + b - 1), base = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const ang = base + bend * A;
  return [sx + Math.cos(ang) * a, sy + Math.sin(ang) * a, sx + Math.cos(base) * d, sy + Math.sin(base) * d];
}
// a stroked limb segment with its ink line
function limb(pts, w, col) {
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const [c, lw] of [[INKL, w + 9], [col, w]]) {
    g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); g.stroke();
  }
}
function handShape(hand, grow) {
  const k = grow;
  if (hand === 'open') {
    g.beginPath(); g.arc(14, 0, 30 + k, 0, Math.PI * 2); g.fill();
    for (let i = -1.5; i <= 1.5; i++) { g.save(); g.rotate(i * .28); rrect(24 - k, -8 - k, 40 + 2 * k, 16 + 2 * k, 8 + k); g.fill(); g.restore(); }
  } else if (hand === 'point') {
    g.beginPath(); g.arc(12, 0, 28 + k, 0, Math.PI * 2); g.fill(); rrect(16 - k, -8 - k, 56 + 2 * k, 16 + 2 * k, 8 + k); g.fill();
  } else { g.beginPath(); g.arc(12, 0, 30 + k, 0, Math.PI * 2); g.fill(); }
}
function arm(sx, sy, tx, ty, bend, hand, prop) {
  const [ex, ey, hx, hy] = ik(sx, sy, tx, ty, 165, 155, bend);
  if (LOOK === 'ville') {            // long sleeve, cuff at the wrist
    const cx = hx + (ex - hx) * .2, cy = hy + (ey - hy) * .2;
    limb([[cx, cy], [hx, hy]], 40, SKIN);
    limb([[sx, sy], [ex, ey], [cx, cy]], 54, SHIRT);
    g.strokeStyle = SHIRT_D; g.lineWidth = 3; g.beginPath(); g.moveTo(ex + (cx - ex) * .8 - 4, ey + (cy - ey) * .8); g.lineTo(cx - 4, cy); g.stroke();
  } else {                           // plain short sleeve
    limb([[sx, sy], [ex, ey], [hx, hy]], 46, SKIN);
    limb([[sx, sy], [sx + (ex - sx) * .5, sy + (ey - sy) * .5]], 62, SHIRT);
  }
  // highlight along the forearm (light from the top left)
  const h0 = LOOK === 'ville' ? .86 : .45;
  g.strokeStyle = SKIN_HI; g.lineWidth = 8; g.globalAlpha = .55; g.beginPath(); g.moveTo(ex + (hx - ex) * h0 - 10, ey + (hy - ey) * h0); g.lineTo(hx - 12, hy - 6); g.stroke(); g.globalAlpha = 1;
  const th = Math.atan2(hy - ey, hx - ex);
  g.save(); g.translate(hx, hy); g.rotate(th);
  if (prop === 'gauge') {
    g.fillStyle = '#20242b'; rrect(10, -9, 90, 18, 8); g.fill();
    g.fillStyle = '#c9d0d9'; rrect(92, -12, 22, 24, 5); g.fill();
  } else if (prop === 'wrench') {
    wrenchShape(0);
  } else if (prop === 'micLow') {   // mic held down along the leg, as in the photo
    g.fillStyle = INKL; rrect(4, -13, 76, 26, 10); g.fill(); g.fillStyle = '#25282e'; rrect(8, -9, 70, 18, 8); g.fill();
    foam(98, 0);
  }
  g.fillStyle = INKL; handShape(hand, 4.5);
  g.fillStyle = SKIN; handShape(hand, 0);
  if (!hand || hand === 'fist') { g.strokeStyle = SKIN_D; g.lineWidth = 4; for (const fy of [-8, 6]) { g.beginPath(); g.moveTo(22, fy); g.lineTo(38, fy); g.stroke(); } }
  g.restore();
  if (hand === 'thumb') { g.fillStyle = INKL; rrect(hx - 15, hy - 70, 32, 58, 16); g.fill(); g.fillStyle = SKIN; rrect(hx - 11, hy - 66, 24, 50, 12); g.fill(); }
  if (prop === 'mic') {             // mic held upright, foam up
    g.fillStyle = INKL; rrect(hx - 14, hy - 82, 28, 74, 11); g.fill(); g.fillStyle = '#25282e'; rrect(hx - 10, hy - 78, 20, 66, 8); g.fill();
    foam(hx, hy - 102);
    if (WAVES >= 0) {                // his voice in the mic
      g.strokeStyle = BLUE; g.lineWidth = 6; g.lineCap = 'round';
      for (let i = 0; i < 3; i++) { const k = (WAVES * 2.2 + i / 3) % 1; g.globalAlpha = 1 - k; g.beginPath(); g.arc(hx, hy - 102, 44 + k * 60, Math.PI * .8, Math.PI * 1.2); g.stroke(); }
      g.globalAlpha = 1;
    }
  }
  if (prop === 'micOut') {          // mic held out to the viewer: your turn!
    g.fillStyle = INKL; rrect(hx - 14, hy - 70, 28, 64, 11); g.fill(); g.fillStyle = '#25282e'; rrect(hx - 10, hy - 66, 20, 56, 8); g.fill();
    g.save(); g.translate(hx - 6, hy - 96); g.scale(1.45, 1.45); foam(0, 0); g.restore();
  }
}
let WAVES = -1;
// open-end wrench, along +x from x0 (handle) to the jaw; navy ink line, steel with a highlight
function wrenchShape(x0) {
  g.save(); g.translate(x0, 0);
  for (const [c, k] of [[INKL, 4], ['#b9c2ce', 0]]) {
    g.fillStyle = c; rrect(10 - k, -11 - k, 124 + 2 * k, 22 + 2 * k, 10 + k); g.fill();
    g.beginPath(); g.arc(146, 0, 30 + k, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = '#e6ebf1'; rrect(22, -7, 96, 5, 3); g.fill();
  g.fillStyle = INKL; g.beginPath(); g.moveTo(150, -12); g.lineTo(184, -16); g.lineTo(184, 16); g.lineTo(150, 12); g.closePath(); g.fill();
  g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.moveTo(154, -9); g.lineTo(190, -13); g.lineTo(190, 13); g.lineTo(154, 9); g.closePath(); g.fill(); g.restore();
  g.restore();
}
function foam(x, y) {
  g.fillStyle = INKL; g.beginPath(); g.arc(x, y, 31, 0, Math.PI * 2); g.fill();
  g.fillStyle = MIC; g.beginPath(); g.arc(x, y, 27, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(x - 9, y - 10, 9, 6, -.6, 0, Math.PI * 2); g.fill();
}

// st.dress (0..1): the work tee being pulled on over the shirt, top to bottom
function mechanic(x, y, t, st) {
  const d = st.dress || 0;
  if (d <= 0 || d >= 1) { setLook(d >= 1 ? 'atelier' : 'ville'); return mech0(x, y, t, st); }
  const sc = st.sc || 1, le = -60 + 900 * d, edge = y + le * sc;
  setLook('ville'); mech0(x, y, t, st);
  setLook('atelier'); g.save(); g.beginPath(); g.rect(0, 0, W, edge); g.clip(); mech0(x, y, t, st); g.restore();
  if (le < 430) {                    // the tee's hem, still rolled up as it comes down
    g.fillStyle = INKL; rrect(x - 134 * sc, edge - 18 * sc, 268 * sc, 36 * sc, 18 * sc); g.fill();
    g.fillStyle = TEE_D; rrect(x - 130 * sc, edge - 14 * sc, 260 * sc, 28 * sc, 14 * sc); g.fill();
  } else {                           // then a bright sweep line turns trousers + shoes into work gear
    g.save(); g.strokeStyle = WH; g.lineWidth = 6 * sc; g.shadowColor = '#ffd34d'; g.shadowBlur = 18;
    g.beginPath(); g.moveTo(x - 130 * sc, edge); g.lineTo(x + 130 * sc, edge); g.stroke(); g.restore();
  }
}

// st: { r: {x,y,bend,hand,prop}, l: {...}, mood, talk }
function mech0(x, y, t, st) {
  const blink = (t % 2.9) < .12 ? .1 : 1, breathe = Math.sin(t * 2.4) * 4;
  const shake = st.mood === 'worried' ? Math.sin(t * 40) * 2.5 : 0;
  g.save(); g.translate(x + shake, y); g.scale(st.sc || 1, st.sc || 1);
  if (st.sway) { g.translate(0, 780); g.rotate(st.sway); g.translate(0, -780); }
  g.rotate(Math.sin(t * 1.7) * .015);
  legs(st, t);
  // left arm: behind the body, or in front when it holds the mic
  const L = st.l || { x: -150, y: 330, bend: 1, hand: 'fist' };
  if (!st.lFront) arm(-100, 40, L.x, L.y, L.bend, L.hand, L.prop);
  // torso (slim, fitted)
  const torso = () => { g.beginPath(); g.moveTo(-112, 34 + breathe * .3); g.quadraticCurveTo(-118, -6, -54, -12); g.lineTo(54, -12);
    g.quadraticCurveTo(118, -6, 112, 34 + breathe * .3); g.quadraticCurveTo(100, 230, 112, 430); g.lineTo(-112, 430); g.quadraticCurveTo(-100, 230, -112, 34 + breathe * .3); g.closePath(); };
  torso(); g.fillStyle = SHIRT; g.fill();
  // volume: shade on the right side, under the light from the top left
  g.save(); torso(); g.clip(); g.fillStyle = SHIRT_D;
  g.beginPath(); g.moveTo(70, -20); g.quadraticCurveTo(50, 200, 78, 440); g.lineTo(140, 440); g.lineTo(140, -20); g.closePath(); g.fill();
  if (LOOK === 'ville') {
    g.strokeStyle = '#b4c0d0'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, 20); g.lineTo(0, 384); g.stroke();   // button placket
    g.fillStyle = '#a6b2c4'; for (let by = 70; by < 384; by += 62) { g.beginPath(); g.arc(9, by, 5, 0, Math.PI * 2); g.fill(); }
    g.strokeStyle = '#d3dbe6'; g.lineWidth = 3; for (const [a, b] of [[[-70, 330], [-20, 372]], [[64, 300], [24, 360]]]) { g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); }  // folds at the belt
    g.fillStyle = '#121316'; g.fillRect(-120, 384, 240, 30);                          // black belt
    g.fillStyle = '#2a2d33'; g.fillRect(-120, 386, 240, 4);
    g.strokeStyle = '#dfe3e8'; g.lineWidth = 5; g.strokeRect(-18, 389, 30, 20);
    g.fillStyle = PANTS; g.fillRect(-120, 414, 240, 18);
  } else {
    g.fillStyle = TEE_D; g.fillRect(-120, 404, 240, 30);
  }
  g.restore();
  torso(); g.strokeStyle = INKL; g.lineWidth = 6; g.stroke();
  // neck + collar
  g.fillStyle = SKIN_D; g.fillRect(-26, -52, 52, 46);
  g.fillStyle = SKIN; g.beginPath(); g.moveTo(-30, -12); g.quadraticCurveTo(0, 34, 30, -12); g.closePath(); g.fill();
  if (LOOK === 'ville') {
    g.fillStyle = SHIRT; g.strokeStyle = INKL; g.lineWidth = 4; g.lineJoin = 'round';
    for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(sd * 30, -26); g.lineTo(sd * 62, -4); g.lineTo(sd * 8, 40); g.lineTo(sd * 22, -10); g.closePath(); g.fill(); g.stroke(); }
    // cream jasmine boutonniere with green leaves (as in the photos)
    g.save(); g.translate(60, 96);
    for (const [lx, ly, r] of [[-16, 14, .7], [14, 18, -.7], [-2, -20, 1.6]]) {
      g.fillStyle = '#2f6e1f'; g.beginPath(); g.ellipse(lx, ly, 18, 9, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = LEAF; g.beginPath(); g.ellipse(lx, ly, 15, 6.5, r, 0, Math.PI * 2); g.fill();
    }
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + t * .4;
      g.fillStyle = '#b7ac72'; g.beginPath(); g.arc(Math.cos(a) * 11, Math.sin(a) * 11, 10, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fbf6dc'; g.beginPath(); g.arc(Math.cos(a) * 11, Math.sin(a) * 11, 8, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = '#f2c230'; g.beginPath(); g.arc(0, 0, 6, 0, Math.PI * 2); g.fill();
    g.restore();
  } else {
    g.strokeStyle = TEE_D; g.lineWidth = 8; g.lineCap = 'round';                    // plain crew neck
    g.beginPath(); g.moveTo(-34, -12); g.quadraticCurveTo(0, 40, 34, -12); g.stroke();
    g.fillStyle = INKL; g.beginPath(); g.arc(54, 112, 46, 0, Math.PI * 2); g.fill();
    g.fillStyle = WH; g.beginPath(); g.arc(54, 112, 42, 0, Math.PI * 2); g.fill();
    const lw = 70, lh = lw * LOGO.height / LOGO.width; g.drawImage(LOGO, 54 - lw / 2, 112 - lh / 2, lw, lh);
  }
  // head
  g.save(); g.translate(0, -140 + breathe * .4);
  g.rotate(st.mood === 'worried' ? -.06 : Math.sin(t * 3) * .03 + (st.talk ? Math.sin(t * 9) * .025 : 0));
  const head = () => { g.beginPath(); g.ellipse(0, -4, 82, 104, 0, 0, Math.PI * 2); };
  for (const sd of [-1, 1]) {        // ears
    g.fillStyle = INKL; g.beginPath(); g.ellipse(sd * 82, 10, 22, 26, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = SKIN; g.beginPath(); g.ellipse(sd * 82, 10, 18, 22, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = SKIN_D; g.lineWidth = 4; g.beginPath(); g.arc(sd * 84, 10, 9, sd > 0 ? -1.2 : Math.PI - 1.9, sd > 0 ? 1.9 : Math.PI + 1.2); g.stroke();
  }
  head(); g.fillStyle = SKIN; g.fill();
  g.save(); head(); g.clip();
  g.fillStyle = SKIN_D; g.globalAlpha = .55; g.beginPath(); g.ellipse(58, 10, 50, 120, -.1, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;  // core shadow
  g.fillStyle = SKIN_HI; g.globalAlpha = .7; g.beginPath(); g.ellipse(-32, -62, 34, 22, -.4, 0, Math.PI * 2); g.fill();                    // shine on the shaved crown
  g.fillStyle = WH; g.globalAlpha = .35; g.beginPath(); g.ellipse(-38, -70, 14, 7, -.5, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  // short trimmed beard along the jaw + moustache (skin stays visible on the cheeks)
  g.fillStyle = BEARD;
  g.beginPath(); g.moveTo(-84, -6); g.quadraticCurveTo(-76, 46, -42, 66); g.quadraticCurveTo(4, 82, 46, 66); g.quadraticCurveTo(78, 46, 84, -6);
  g.lineTo(90, 0); g.lineTo(90, 120); g.lineTo(-90, 120); g.lineTo(-90, 0); g.closePath(); g.fill();

// speech bubble, typed on; tail from the edge facing the speaker
function bubble(lines, x, y, maxW, tail, p, typed, big) {
  if (p <= 0) return;
  const F = big ? 64 : 52, wt = big ? 800 : 700;
  g.save(); g.font = `${wt} ${F}px Montserrat`; const tw = Math.max(...lines.map(l => g.measureText(l).width)); g.restore();
  const fs = Math.min(F, Math.floor(F * (maxW - 72) / tw)), lh = fs * 1.25, w = tw * fs / F + 72, h = 50 + lines.length * lh;
  g.save(); g.translate(x + w / 2, y + h / 2); g.scale(p, p); g.translate(-(x + w / 2), -(y + h / 2));
  g.shadowColor = 'rgba(0,20,60,.25)'; g.shadowBlur = 28; g.shadowOffsetY = 10;
  g.fillStyle = WH; g.strokeStyle = BLUE; g.lineWidth = 6;
  g.beginPath(); g.roundRect(x, y, w, h, 34); g.fill(); g.shadowColor = 'transparent'; g.stroke();
  let a, b;  // tail base points
  if (tail[0] > x + 30 && tail[0] < x + w - 30) { const by = tail[1] > y + h / 2 ? y + h : y, bx = clamp(tail[0], x + 60, x + w - 60); a = [bx - 24, by]; b = [bx + 20, by]; }  // speaker below/above: tail from the bottom/top edge
  else { const sx = tail[0] < x + w / 2 ? x : x + w, ty = clamp(tail[1], y + 40, y + h - 40); a = [sx, ty - 22]; b = [sx, ty + 18]; }
  g.beginPath(); g.moveTo(...a); g.lineTo(...tail); g.lineTo(...b); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(...a); g.lineTo(...tail); g.lineTo(...b); g.stroke();
  g.fillStyle = WH; g.beginPath(); g.moveTo(a[0] + (b[0] - a[0]) * .1, a[1] + (b[1] - a[1]) * .1 - (a[1] === b[1] ? 4 : 0));
  g.lineTo(b[0] - (b[0] - a[0]) * .1, b[1] - (b[1] - a[1]) * .1 - (a[1] === b[1] ? 4 : 0)); g.lineWidth = 8; g.strokeStyle = WH; g.stroke();
  const words = lines.map(l => l.split(' ')), nW = words.flat().length; let left = Math.ceil(nW * typed - 1e-6);
  lines.forEach((l, i) => {
    const s = words[i].slice(0, Math.max(0, left)).join(' '); left -= words[i].length;
    text(s, x + 36, y + h / 2 + (i - (lines.length - 1) / 2) * lh, { f: 'Montserrat', w: wt, s: fs, col: INK, align: 'left' });
  });
  g.restore();
}

// raised for the title, held out to the viewer for the closing question. Mic arm in front of the body.
const MIC_CHEST = { x: -28, y: 64, bend: 1, hand: 'fist', prop: 'mic' }, MIC_MOUTH = { x: -40, y: 6, bend: 1, hand: 'fist', prop: 'mic', waves: true };

const WRENCH = { x: -190, y: -50, bend: -1, hand: 'fist', prop: 'wrench' }, CATCH = { x: -215, y: -150, bend: -1, hand: 'open' };
function poseAt(t) {
  const st = { mood: 'happy', sc: 1, dress: eOut(lin(t, DRESS[0], DRESS[1])), lFront: true, l: MIC_CHEST };
  const talking = LINES0.some(l => l[7] === 'm' && t >= l[0] && t < l[0] + l[2] + .25);
  if (t < SETTLE) { st.mood = t > T0 + .75 ? 'grin' : 'happy'; st.wink = t > T0 + .75 && t < T0 + 1.05; }   // his pose in the photo, then the wink
  else if (t < 4.3) {                // "Eh oui… c'est moi, Alonzo !" — into the mic, other hand on his chest
    st.mood = t < 3.6 ? 'shock' : 'happy'; st.r = t < 3.6 ? { x: 130, y: -20, bend: 1, hand: 'open' } : { x: 40, y: 90, bend: 1, hand: 'open' };
    if (t >= 3.6) st.l = MIC_MOUTH;

  else if (t < FLIP[1]) { st.mood = 'grin'; st.l = CATCH; }            // mic in the air: open hand ready to catch
  else if (t < 8.2) st.mood = 'happy';
  else if (t < 9.3) { st.mood = 'worried'; st.r = { x: 10, y: -170, bend: 1, hand: 'open' }; }             // facepalm
  else if (t < 9.62) st.l = MIC_MOUTH;                                                                        // "Pas avec moi !"
  else if (t < 10.0) st.mood = 'grin';
  else if (t < 11.2) { st.mood = 'grin'; st.l = MIC_UP; }                                                     // presenter: mic up for the title
  else if (t < SWAP[0]) st.mood = 'grin';
  else if (t < SWAP[1]) { st.mood = 'grin'; st.l = CATCH; }                                                 // mic in the air…
  else { st.mood = 'grin'; st.r = { x: 290, y: 200, bend: 1, hand: 'point' }; st.l = WRENCH; }              // …back to work: wrench in hand, points at the car
  if (talking && st.l === MIC_MOUTH) st.waves = true;

}

const LINES0 = [
  [3.6, 5.55, .6, ['Eh oui… c’est moi,', 'Alonzo !'], 40, 250, 580, 'm'],
  [7.55, 9.6, 0, ['Ça va passer…'], 400, 900, 540, 'c', 1],          // the client's line for the whole season: big, all at once, it trembles
  [8.9, 10.9, 0, ['Ah non.', 'Pas avec moi !'], 400, 545, 540, 'm'],   // all at once, held past the outfit change so it can be read
  [14.25, 17.4, .5, ['Et sa voiture ?'], 400, 560, 540, 'm'],
];

function mascotPos(t) {
  if (t < SETTLE) return PH;
  if (t < 5.6) { const p = eInOut(lin(t, SETTLE, SETTLE + .5)); return { x: PH.x + (MASC.x - PH.x) * p, y: PH.y + (MASC.y - PH.y) * p, sc: PH.sc + (MASC.sc - PH.sc) * p }; }
  const p = eInOut(lin(t, 5.6, 6.15)), hop = Math.sin(Math.PI * p) * 180, gp = groundPos(t);
  return { x: gp.x, y: gp.y - hop, sc: gp.sc };
}
function groundPos(t) {              // mascot position without the hop
  if (t < 5.6) return mascotPos(t);

  return { x: MASC.x + (HOME.x - MASC.x) * p, y: MASC.y + (HOME.y - MASC.y) * p, sc: MASC.sc + (HOME.sc - MASC.sc) * p };
}

function carState(t) {

}

function render(t) {

  if (t >= 3.6 && t < 5.6) { g.save(); g.globalAlpha = 1 - lin(t, 5.3, 5.6); marker('ALONZO', MASC.x, 1600, 3.6, t, 90, RED, WH); g.restore(); }  // he introduces himself

    const m = mascotPos(t), st = poseAt(t); st.sc = m.sc;
    const say = LINES0.find(l => l[7] === 'm' && t >= l[0] && t < l[1]);
    if (say && t < say[0] + say[2] + .1) st.talk = true;
    if (st.talk && st.mood === 'happy') st.mood = 'talk';
    if (t > T0 + .9) {               // ground shadow: stays on the floor and shrinks while he is in the air
      const gp = groundPos(t), air = clamp((gp.y - m.y) / 180);

    // mic flip during the hop (caught again), and the last-shot swap: mic goes up, a wrench comes down
    for (const [a, b, swap] of [[FLIP[0], FLIP[1], false], [SWAP[0], SWAP[1], true]]) {
      const fp = lin(t, a, b); if (fp <= 0 || fp >= 1) continue;
      const fx = m.x - 215 * m.sc, fy = m.y - 230 * m.sc - Math.sin(Math.PI * fp) * 120;

      if (swap && fp > .5) { g.rotate(Math.PI / 2); wrenchShape(-70); }
      else { g.fillStyle = INKL; rrect(-14, -30, 28, 80, 11); g.fill(); g.fillStyle = '#25282e'; rrect(-10, -26, 20, 72, 8); g.fill(); foam(0, -52); }
      g.restore();

      if (pf > 0) { g.save(); g.translate(fx, fy); g.globalAlpha = pf; g.strokeStyle = WH; g.lineWidth = 8; g.lineCap = 'round';
        for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2, r0 = 40 + (1 - pf) * 40; g.beginPath(); g.moveTo(Math.cos(an) * r0, Math.sin(an) * r0); g.lineTo(Math.cos(an) * (r0 + 34), Math.sin(an) * (r0 + 34)); g.stroke(); }
        g.fillStyle = '#ffd34d'; g.beginPath(); g.arc(0, 0, 30 * pf, 0, Math.PI * 2); g.fill(); g.restore(); }
    }
  }
  // the work tee drops onto him, then slides on
  if (t >= DRESS[0] - .22 && t < DRESS[0] + .02) {
    const m = mascotPos(t), k = eIn(lin(t, DRESS[0] - .22, DRESS[0])), ty = -150 + (m.y - 250 * m.sc + 150) * k;

    g.fillStyle = NAVY; g.strokeStyle = WH; g.lineWidth = 10; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(-50, -60); g.quadraticCurveTo(0, -36, 50, -60); g.lineTo(130, -20); g.lineTo(100, 30); g.lineTo(80, 18); g.lineTo(80, 120);
    g.lineTo(-80, 120); g.lineTo(-80, 18); g.lineTo(-100, 30); g.lineTo(-130, -20); g.closePath(); g.stroke(); g.fill();
    g.fillStyle = WH; g.beginPath(); g.arc(36, 0, 24, 0, Math.PI * 2); g.fill();
    const lw = 38, lh = lw * LOGO.height / LOGO.width; g.drawImage(LOGO, 36 - lw / 2, -lh / 2, lw, lh);
    g.restore();
  }
  // end block: logo + contact
  const ep = eBack(lin(t, 15.0, 15.4));
  if (ep > 0) {
    g.save(); g.translate(195, 452); g.scale(ep * 1.1, ep * 1.1);
    g.shadowColor = 'rgba(8,40,90,.25)'; g.shadowBlur = 24; g.fillStyle = WH; g.beginPath(); g.ellipse(0, 0, 100, 86, -.1, 0, Math.PI * 2); g.fill(); g.shadowColor = 'transparent';
    const lw = 165, lh = lw * LOGO.height / LOGO.width; g.drawImage(LOGO, -lw / 2, -lh / 2, lw, lh);
    g.restore();
    g.save(); g.globalAlpha = clamp(ep); g.fillStyle = 'rgba(255,255,255,.94)'; rrect(400, 392, 480, 140, 34); g.fill(); g.restore();
    text('Combani', 640, 432, { f: 'Montserrat', w: 800, s: 44, col: BLUE, a: clamp(ep) });
    text('+262 639 29 17 02', 640, 496, { f: 'Montserrat', w: 800, s: 52, col: BLUE, a: clamp(ep) });
  }
  // the call to action: big marker that pulses on the beat, a line to say where, and an arrow bouncing onto the car
  if (t >= 14.6) {
    { const a = eOut(lin(t, 14.6, 14.9)); g.save(); g.globalAlpha *= a; g.fillStyle = '#f4f6f9'; rrect(430, 730, 540, 190, 40); g.fill(); g.restore(); }   // over the name panel of the set
    const beat = Math.pow(Math.max(0, Math.cos(Math.PI * 2 * (t - 14.6) / BEAT)), 6), k = 1 + .05 * beat * lin(t, 15, 15.3);
    g.save(); g.translate(700, 790); g.scale(k, k); g.translate(-700, -790);
    marker('QUEL PRÉNOM ?', 700, 790, 14.6, t, fit('QUEL PRÉNOM ?', 112, 420), RED, WH); g.restore();
    text('Répondez en commentaire', 700, 880, { f: 'Montserrat', w: 800, s: 34, col: INK, a: eOut(lin(t, 14.8, 15.1)) });
    const b = Math.abs(Math.sin(t * 5)) * 18, a = eOut(lin(t, 14.6, 14.9)), ax = 700; g.save(); g.globalAlpha = a; g.fillStyle = RED;
    g.beginPath(); g.moveTo(ax - 25, 975 + b); g.lineTo(ax + 25, 975 + b); g.lineTo(ax + 25, 1020 + b); g.lineTo(ax + 62, 1020 + b); g.lineTo(ax, 1085 + b); g.lineTo(ax - 62, 1020 + b); g.lineTo(ax - 25, 1020 + b); g.closePath(); g.fill(); g.restore();
  }
  // bubbles
  for (const [a, b, d, lines, bx, by, bw, who, big] of LINES0) {
    if (t < a || t > b) continue;
    const p = eBack(lin(t, a, a + .3)) * (1 - eIn(lin(t, b - .25, b))), typed = d ? lin(t, a + .1, a + .1 + d) : 1;
    let tail;
    if (who === 'c') { const cs = carState(t); tail = [cs.x + (-55 - cs.pop * 70) * 1.05, cs.y + (-140 - cs.pop * 60) * 1.05]; }
    else { const m = mascotPos(t); tail = bx > m.x ? [m.x + 110 * m.sc, m.y - 140 * m.sc] : [m.x - 100 * m.sc, m.y - 150 * m.sc]; }   // tail toward his mouth
    g.save(); if (big) g.translate(Math.sin(t * 38) * 4 * (1 - lin(t, a + .3, a + .9)) + Math.sin(t * 9) * 1.5, 0);   // nervous tremble
    bubble(lines, bx, by, bw, tail, p, typed, big); g.restore();
  }
  grain(t);
}

// ---------------------------------------------------------------- beat sync (Alpajo, 143.6 BPM)
// The track starts 0.76 s in, so its beats fall at 2.0 s + k × 0.4178 s in the video (the wink is on a beat).
// The animation is written in "design time"; this piecewise-linear warp moves each key hit onto a beat
// (or a half-beat for the quick ones) and stretches/squeezes the time between them. SFX follow the same warp.
const BEAT = 60 / 143.6, B0 = 2.0, onBeat = (n, half) => B0 + n * BEAT / (half ? 2 : 1);
const WARP = [                     // [design time, video time]
  [0, 0], [2.0, onBeat(0)],         // wink
  [3.6, onBeat(4)],                 // "Eh oui… c'est moi, Alonzo !" + name marker
  [5.6, onBeat(9)], [6.15, onBeat(10)],   // hop + mic flip, caught on the beat as the car rolls in
  [6.9, onBeat(23, 1)], [7.2, onBeat(12)],  // screech (half-beat), first honk
  [8.2, onBeat(15)],                // facepalm
  [8.9, onBeat(33, 1)], [9.6, onBeat(37, 1)],  // "Ah non. Pas avec moi !", work outfit sweeps on
  [10.0, onBeat(20)],               // series title (lands as the outfit is complete)
  [SWAP[0], onBeat(28)],            // mic tossed
  [SWAP[1], onBeat(29)], [15.0, onBeat(31)],  // wrench caught + closing question, logo
  [DUR, DUR],
];
function warp(t, from, to) {
  for (let i = 1; i < WARP.length; i++) {
    const [a0, b0] = [WARP[i - 1][from], WARP[i - 1][to]], [a1, b1] = [WARP[i][from], WARP[i][to]];
    if (t <= a1 || i === WARP.length - 1) return b0 + (t - a0) * (b1 - b0) / (a1 - a0);
  }
}
const toVideo = t => warp(t, 0, 1), toDesign = t => warp(t, 1, 0);
window.SFX = SFX0.map(([t, ...rest]) => [+toVideo(t).toFixed(3), ...rest]);
const renderDesign = render;      // (a global function declaration: keep the original before overriding window.render)
window.render = t => renderDesign(toDesign(t));

Promise.all([

]).then(() => { render(0); window.ready = true; });
