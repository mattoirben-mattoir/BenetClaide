<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(file:///usr/share/fonts/opentype/inter/Inter-Black.otf);font-weight:900}
@font-face{font-family:Inter;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf);font-weight:800}
@font-face{font-family:Inter;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:Inter;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf);font-weight:500}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const c = document.getElementById('c'), g = c.getContext('2d');
const BG = '#0f1216', BG2 = '#1a1f26', Y = '#FFC21A', T = '#14B8A6', WH = '#ffffff', MUTED = '#AEB6C2';

// Scene boundaries (seconds), aligned with the voice-over
const S = [0, 2.2, 4.3, 6.5, 9.25, 12];

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function font(w, s) { g.font = `${w} ${s}px Inter`; }
function text(str, x, y, { w = 800, s = 60, col = WH, align = 'center', a = 1, ls = 0 } = {}) {
  g.save(); g.globalAlpha *= a; font(w, s); g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle';
  if (ls) g.letterSpacing = ls + 'px';
  g.fillText(str, x, y); g.restore();
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// Text that rises in from a mask
function revealText(str, x, y, t0, t, opts) {
  const p = eOut(lin(t, t0, t0 + .45));
  if (p <= 0) return;
  const s = opts.s || 60;
  g.save();
  g.beginPath(); g.rect(0, y - s * .75, W, s * 1.5); g.clip();
  text(str, x, y + (1 - p) * s * 1.2, { ...opts, a: p });
  g.restore();
}

// Tire drawing
function tire(cx, cy, r, rot, opts = {}) {
  g.save(); g.translate(cx, cy); g.rotate(rot);
  // shadow
  g.fillStyle = '#05070a'; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  // treads
  const n = 28;
  for (let i = 0; i < n; i++) {
    g.save(); g.rotate(i / n * Math.PI * 2);
    g.fillStyle = '#2a2f37';
    g.beginPath(); g.moveTo(-r * .07, -r); g.lineTo(r * .07, -r); g.lineTo(r * .04, -r * .84); g.lineTo(-r * .1, -r * .84); g.closePath(); g.fill();
    g.restore();
  }
  // sidewall
  g.fillStyle = '#1b1f25'; g.beginPath(); g.arc(0, 0, r * .8, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#2c323b'; g.lineWidth = r * .02; g.beginPath(); g.arc(0, 0, r * .74, 0, Math.PI * 2); g.stroke();
  // rim
  const rg = g.createRadialGradient(0, 0, r * .05, 0, 0, r * .56);
  rg.addColorStop(0, '#e9edf2'); rg.addColorStop(1, '#8a929e');
  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, r * .56, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3a414b'; g.beginPath(); g.arc(0, 0, r * .5, 0, Math.PI * 2); g.fill();
  // spokes
  for (let i = 0; i < 5; i++) {
    g.save(); g.rotate(i / 5 * Math.PI * 2);
    g.fillStyle = '#cfd5dd';
    g.beginPath(); g.moveTo(-r * .06, -r * .1); g.lineTo(r * .06, -r * .1); g.lineTo(r * .11, -r * .5); g.lineTo(-r * .11, -r * .5); g.closePath(); g.fill();
    g.restore();
  }
  g.fillStyle = opts.hub || Y; g.beginPath(); g.arc(0, 0, r * .12, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#1b1f25'; g.beginPath(); g.arc(0, 0, r * .05, 0, Math.PI * 2); g.fill();
  g.restore();
}

// Background: subtle gradient + moving diagonal stripes
function background(t) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, BG2); gr.addColorStop(1, BG);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = .045; g.fillStyle = WH;
  const off = (t * 60) % 160;
  for (let x = -H; x < W + H; x += 160) {
    g.beginPath(); g.moveTo(x + off, 0); g.lineTo(x + off + 50, 0); g.lineTo(x + off + 50 - H * .6, H); g.lineTo(x + off - H * .6, H); g.closePath(); g.fill();
  }
  g.restore();
  // soft glow
  const rg = g.createRadialGradient(W * .5, H * .42, 50, W * .5, H * .42, 900);
  rg.addColorStop(0, 'rgba(255,194,26,0.10)'); rg.addColorStop(1, 'rgba(255,194,26,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

// Persistent header + progress
function chrome(t) {
  const a = eOut(lin(t, .1, .6));
  g.save(); g.globalAlpha = a;
  rrect(W / 2 - 250, 110 - 40 * (1 - a), 500, 72, 36); g.fillStyle = 'rgba(255,255,255,0.06)'; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 2; g.stroke();
  g.fillStyle = Y; g.beginPath(); g.arc(W / 2 - 205, 146 - 40 * (1 - a), 9, 0, Math.PI * 2); g.fill();
  text('CENTRE AUTO ALONZO', W / 2 + 14, 147 - 40 * (1 - a), { w: 800, s: 30, col: WH, ls: 3 });
  g.restore();
  // step dots for tips
  const step = t < S[1] ? 0 : t < S[2] ? 1 : t < S[3] ? 2 : t < S[4] ? 3 : 4;
  const da = eOut(lin(t, S[1], S[1] + .4)) * (1 - eOut(lin(t, S[4] - .2, S[4] + .2)));
  if (da > 0) {
    g.save(); g.globalAlpha = da;
    for (let i = 1; i <= 3; i++) {
      const on = i <= step;
      const w = i === step ? 90 : 26;
      const x = W / 2 + (i - 2) * 120 - w / 2;
      rrect(x, 1700, w, 14, 7); g.fillStyle = on ? Y : 'rgba(255,255,255,0.18)'; g.fill();
    }
    g.restore();
  }
  // bottom progress line
  rrect(0, H - 10, W * (t / 12), 10, 0); g.fillStyle = Y; g.fill();
}

// Diagonal wipe between scenes
function wipe(t, at) {
  const d = .42, p = lin(t, at - d / 2, at + d / 2);
  if (p <= 0 || p >= 1) return;
  const x = -W * 1.2 + eInOut(p) * W * 3.0;
  g.save(); g.translate(x, 0); g.transform(1, 0, -.35, 1, 0, 0);
  g.fillStyle = Y; g.fillRect(0, 0, 220, H * 1.2);
  g.fillStyle = T; g.fillRect(-90, 0, 60, H * 1.2);
  g.restore();
}

// Scene local alpha (fade/slide out)
function sceneOut(t, end) { return 1 - eIn(lin(t, end - .22, end)); }

// ---------- Scenes ----------
function intro(t) {
  const out = sceneOut(t, S[1]);
  g.save(); g.globalAlpha = out;
  // rolling tire
  const p = eOut(lin(t, 0, .9));
  const r = 270, cx = -r + p * (W / 2 + r), cy = 690;
  const rot = (cx + r) / r;
  // speed lines while rolling
  if (p < .99) {
    g.save(); g.globalAlpha *= (1 - p);
    g.strokeStyle = Y; g.lineCap = 'round';
    for (let i = 0; i < 4; i++) { g.lineWidth = 10; g.beginPath(); g.moveTo(cx - r - 40 - i * 30, cy - 120 + i * 80); g.lineTo(cx - r - 260 - i * 30, cy - 120 + i * 80); g.stroke(); }
    g.restore();
  }
  const bob = Math.sin(t * 6) * 4 * lin(t, .9, 1.3);
  tire(cx, cy + bob, r, rot + t * .6);
  // badge "3"
  const bp = eBack(lin(t, .55, .95));
  if (bp > 0) {
    g.save(); g.translate(W / 2 + 200, 500); g.scale(bp, bp); g.rotate(-.12);
    g.fillStyle = Y; g.beginPath(); g.arc(0, 0, 105, 0, Math.PI * 2); g.fill();
    text('3', 0, 8, { w: 900, s: 150, col: '#111' });
    g.restore();
  }
  revealText('CONSEILS', W / 2, 1110, .45, t, { w: 900, s: 150, col: WH, ls: 4 });
  revealText('pour faire durer', W / 2, 1250, .65, t, { w: 700, s: 68, col: MUTED });
  revealText('vos pneus', W / 2, 1350, .8, t, { w: 900, s: 96, col: Y });
  g.restore();
}

// Pressure gauge icon
function gauge(cx, cy, t, t0) {
  const r = 230, a0 = Math.PI * .75, a1 = Math.PI * 2.25;
  const p = eOut(lin(t, t0, t0 + .5));
  g.save(); g.translate(cx, cy); g.scale(.6 + .4 * eBack(lin(t, t0, t0 + .5)), .6 + .4 * eBack(lin(t, t0, t0 + .5))); g.globalAlpha *= p;
  g.fillStyle = '#1d232b'; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 6; g.stroke();
  // zones
  g.lineWidth = 26; g.lineCap = 'butt';
  const zone = (f0, f1, col) => { g.strokeStyle = col; g.beginPath(); g.arc(0, 0, r * .78, a0 + (a1 - a0) * f0, a0 + (a1 - a0) * f1); g.stroke(); };
  zone(0, .4, '#E5484D'); zone(.4, .58, '#F5A524'); zone(.58, .82, T); zone(.82, 1, '#E5484D');
  // ticks
  for (let i = 0; i <= 10; i++) {
    const a = a0 + (a1 - a0) * i / 10;
    g.strokeStyle = WH; g.lineWidth = i % 5 ? 4 : 7;
    g.beginPath(); g.moveTo(Math.cos(a) * r * .58, Math.sin(a) * r * .58); g.lineTo(Math.cos(a) * r * .5, Math.sin(a) * r * .5); g.stroke();
  }
  // needle sweeps to the OK zone, with a small overshoot
  const np = lin(t, t0 + .3, t0 + 1.2);
  const f = .1 + .6 * eBack(np) + Math.sin(t * 20) * .004 * np;
  const na = a0 + (a1 - a0) * f;
  g.strokeStyle = Y; g.lineWidth = 12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-Math.cos(na) * 30, -Math.sin(na) * 30); g.lineTo(Math.cos(na) * r * .66, Math.sin(na) * r * .66); g.stroke();
  g.fillStyle = Y; g.beginPath(); g.arc(0, 0, 24, 0, Math.PI * 2); g.fill();
  text('BAR', 0, r * .45, { w: 800, s: 34, col: MUTED, ls: 4 });
  // OK check
  const ck = eBack(lin(t, t0 + 1.1, t0 + 1.4));
  if (ck > 0) {
    g.save(); g.translate(r * .78, -r * .72); g.scale(ck, ck);
    g.fillStyle = T; g.beginPath(); g.arc(0, 0, 52, 0, Math.PI * 2); g.fill();
    g.strokeStyle = WH; g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(-20, 2); g.lineTo(-5, 17); g.lineTo(22, -14); g.stroke();
    g.restore();
  }
  g.restore();
}

// Tread wear + vibration icon
function wear(cx, cy, t, t0) {
  const p = eOut(lin(t, t0, t0 + .5));
  const shake = lin(t, t0 + .7, t0 + 1.0) * (1 - lin(t, t0 + 1.6, t0 + 1.9));
  const sx = Math.sin(t * 70) * 10 * shake;
  g.save(); g.translate(cx + sx, cy); g.globalAlpha *= p; g.scale(.7 + .3 * eBack(lin(t, t0, t0 + .5)), .7 + .3 * eBack(lin(t, t0, t0 + .5)));
  // tread block (front view of a tire)
  const w = 300, h = 440;
  rrect(-w / 2, -h / 2, w, h, 60); g.fillStyle = '#1b1f25'; g.fill();
  g.save(); rrect(-w / 2, -h / 2, w, h, 60); g.clip();
  // grooves
  g.fillStyle = '#0b0d10';
  for (const gx of [-70, 0, 70]) g.fillRect(gx - 9, -h / 2, 18, h);
  // tread blocks, right side worn (uneven wear reveal)
  const wp = eOut(lin(t, t0 + .35, t0 + 1.1));
  for (let row = 0; row < 8; row++) {
    const y = -h / 2 + 18 + row * 54;
    [-115, -35, 35, 115].forEach((bx, i) => {
      const worn = i >= 2 ? wp * (i === 3 ? .85 : .45) : 0;
      g.fillStyle = worn > .5 ? '#3a2e1d' : '#2e343d';
      g.globalAlpha = 1 - worn * .7;
      g.beginPath(); g.moveTo(bx - 28, y); g.lineTo(bx + 28, y + 10); g.lineTo(bx + 28, y + 40); g.lineTo(bx - 28, y + 30); g.closePath(); g.fill();
    });
  }
  g.globalAlpha = 1;
  // worn-zone highlight
  g.fillStyle = `rgba(229,72,77,${.28 * wp})`; g.fillRect(40, -h / 2, w / 2, h);
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 5; rrect(-w / 2, -h / 2, w, h, 60); g.stroke();
  g.restore();
  // vibration arcs
  if (shake > 0) {
    g.save(); g.globalAlpha *= shake; g.strokeStyle = Y; g.lineWidth = 10; g.lineCap = 'round';
    for (const side of [-1, 1]) for (let i = 0; i < 3; i++) {
      const rr = 200 + i * 45 + (t * 120 % 45);
      g.beginPath(); g.arc(cx, cy, rr, side > 0 ? -.35 : Math.PI - .35, side > 0 ? .35 : Math.PI + .35); g.stroke();
    }
    g.restore();
  }
  // warning badge
  const wb = eBack(lin(t, t0 + 1.0, t0 + 1.3));
  if (wb > 0) {
    g.save(); g.translate(cx + 190, cy - 220); g.scale(wb, wb);
    g.fillStyle = Y; g.beginPath(); g.moveTo(0, -62); g.lineTo(62, 50); g.lineTo(-62, 50); g.closePath(); g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = Y; g.stroke(); g.fill();
    text('!', 0, 12, { w: 900, s: 80, col: '#111' });
    g.restore();
  }
}

// Balance + alignment icon: two wheels with parallel guide lines
function align(cx, cy, t, t0) {
  const p = eOut(lin(t, t0, t0 + .5));
  g.save(); g.globalAlpha *= p;
  const ap = eInOut(lin(t, t0 + .5, t0 + 1.3));
  const skew = (1 - ap) * .22;
  const r = 130;
  // axle
  g.strokeStyle = '#3a414b'; g.lineWidth = 16; g.beginPath(); g.moveTo(cx - 200, cy); g.lineTo(cx + 200, cy); g.stroke();
  // wheels seen from above (rounded rects), toe corrected over time
  [[-1, skew], [1, -skew]].forEach(([s, a]) => {
    g.save(); g.translate(cx + s * 230, cy); g.rotate(a * s);
    rrect(-48, -r * 1.25, 96, r * 2.5, 30); g.fillStyle = '#1b1f25'; g.fill();
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 4; g.stroke();
    g.fillStyle = '#2e343d';
    for (let i = 0; i < 7; i++) g.fillRect(-40, -r * 1.15 + i * 44 + ((t * 200) % 44), 80, 22);
    g.restore();
  });
  // guide lines go teal when parallel
  const ok = lin(t, t0 + 1.2, t0 + 1.4);
  g.setLineDash([26, 20]); g.lineDashOffset = -t * 120;
  g.strokeStyle = ok > .5 ? T : Y; g.lineWidth = 6;
  for (const s of [-1, 1]) {
    const a = (s < 0 ? skew : -skew) * s;
    g.save(); g.translate(cx + s * 230, cy); g.rotate(a);
    g.beginPath(); g.moveTo(0, -420); g.lineTo(0, 420); g.stroke();
    g.restore();
  }
  g.setLineDash([]);
  // balance weight bouncing on the left wheel
  const wb = eBack(lin(t, t0 + .25, t0 + .6));
  if (wb > 0) {
    g.save(); g.translate(cx, cy - 300); g.scale(wb, wb);
    rrect(-80, -30, 160, 60, 14); g.fillStyle = Y; g.fill();
    g.fillStyle = '#111'; for (const dx of [-40, 0, 40]) g.fillRect(dx - 3, -18, 6, 36);
    g.restore();
  }
  const ck = eBack(lin(t, t0 + 1.35, t0 + 1.65));
  if (ck > 0) {
    g.save(); g.translate(cx, cy + 300); g.scale(ck, ck);
    g.fillStyle = T; g.beginPath(); g.arc(0, 0, 52, 0, Math.PI * 2); g.fill();
    g.strokeStyle = WH; g.lineWidth = 11; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(-20, 2); g.lineTo(-5, 17); g.lineTo(22, -14); g.stroke();
    g.restore();
  }
  g.restore();
}

function tipScene(t, t0, t1, num, title1, title2, sub1, sub2, icon) {
  const out = sceneOut(t, t1);
  g.save(); g.globalAlpha = out;
  // big ghost number
  const np = eOut(lin(t, t0, t0 + .5));
  text(num, W / 2 + 330 - np * 40, 430, { w: 900, s: 360, col: 'rgba(255,255,255,0.06)', a: np });
  // number pill
  const pp = eBack(lin(t, t0 + .05, t0 + .4));
  if (pp > 0) {
    g.save(); g.translate(130, 330); g.scale(pp, pp);
    rrect(0, -50, 300, 100, 50); g.fillStyle = Y; g.fill();
    text('CONSEIL ' + num, 150, 3, { w: 900, s: 36, col: '#111', ls: 2 });
    g.restore();
  }
  icon(W / 2, 760, t, t0 + .1);
  revealText(title1, W / 2, 1195, t0 + .2, t, { w: 900, s: 86, col: WH });
  if (title2) revealText(title2, W / 2, 1295, t0 + .3, t, { w: 900, s: 86, col: Y });
  revealText(sub1, W / 2, 1440, t0 + .45, t, { w: 500, s: 46, col: MUTED });
  revealText(sub2, W / 2, 1505, t0 + .55, t, { w: 500, s: 46, col: MUTED });
  g.restore();
}

function outro(t) {
  const t0 = S[4];
  // wrench + tire combo
  const p = eBack(lin(t, t0 + .05, t0 + .55));
  tire(W / 2, 640, 230 * Math.max(p, 0.001), t * 1.2);
  // rotating highlight ring
  g.save(); g.globalAlpha = eOut(lin(t, t0 + .3, t0 + .7));
  g.strokeStyle = Y; g.lineWidth = 12; g.lineCap = 'round';
  g.beginPath(); g.arc(W / 2, 640, 280, t * 2.5, t * 2.5 + Math.PI * 1.3); g.stroke();
  g.strokeStyle = T; g.beginPath(); g.arc(W / 2, 640, 280, t * 2.5 + Math.PI * 1.45, t * 2.5 + Math.PI * 1.85); g.stroke();
  g.restore();
  revealText('Besoin d’un check-up ?', W / 2, 1020, t0 + .15, t, { w: 700, s: 64, col: MUTED });
  // brand block
  const bp = eOut(lin(t, t0 + .35, t0 + .8));
  if (bp > 0) {
    g.save(); g.globalAlpha = bp;
    const bw = 900 * bp;
    rrect(W / 2 - bw / 2, 1100, bw, 290, 40); g.fillStyle = Y; g.fill();
    g.restore();
    revealText('CENTRE AUTO', W / 2, 1185, t0 + .55, t, { w: 900, s: 92, col: '#111', ls: 2 });
    revealText('ALONZO', W / 2, 1300, t0 + .65, t, { w: 900, s: 120, col: '#111', ls: 8 });
  }
  revealText('Diagnostic précis · Mayotte', W / 2, 1480, t0 + .85, t, { w: 700, s: 50, col: WH });
  // CTA pulse
  const cp = eBack(lin(t, t0 + 1.1, t0 + 1.45));
  if (cp > 0) {
    const pulse = 1 + Math.sin((t - t0) * 6) * .025 * lin(t, t0 + 1.5, t0 + 1.8);
    g.save(); g.translate(W / 2, 1610); g.scale(cp * pulse, cp * pulse);
    rrect(-300, -52, 600, 104, 52); g.strokeStyle = T; g.lineWidth = 5; g.stroke();
    g.fillStyle = 'rgba(20,184,166,.15)'; g.fill();
    text('🔧  Prenez rendez-vous', 0, 2, { w: 800, s: 42, col: WH });
    g.restore();
  }
}

function render(t) {
  g.clearRect(0, 0, W, H);
  background(t);
  if (t < S[1]) intro(t);
  else if (t < S[2]) tipScene(t, S[1], S[2], '01', 'Vérifiez la pression', 'chaque mois', 'malgré la chaleur', 'et les routes abîmées', gauge);
  else if (t < S[3]) tipScene(t, S[2], S[3], '02', 'Surveillez l’usure', 'et les vibrations', 'usure inégale ou vibrations ?', 'un problème peut se cacher', wear);
  else if (t < S[4]) tipScene(t, S[3], S[4], '03', 'Équilibrage', '& parallélisme', 'des pneus bien alignés =', 'une conduite stable', align);
  else outro(t);
  chrome(t);
  for (let i = 1; i < 5; i++) wipe(t, S[i]);
  // fade from/to black
  const fb = 1 - lin(t, 0, .15);
  if (fb > 0) { g.fillStyle = `rgba(0,0,0,${fb})`; g.fillRect(0, 0, W, H); }
}
window.render = render;
document.fonts.load('900 40px Inter').then(() => document.fonts.load('500 40px Inter')).then(() => document.fonts.load('700 40px Inter')).then(() => document.fonts.load('800 40px Inter')).then(() => { render(0); window.ready = true; });
</script>
</body></html>
